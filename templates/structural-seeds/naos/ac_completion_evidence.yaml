schema: naos.ac_completion_evidence_manifest.v1
version: "1.0"
semantics:
  purpose: "Declare AC/SCEN completion evidence for deterministic review."
  empty_manifest_rule: "An empty completions list means no completion evidence is configured or claimed."
  repository_binding_rule: "Optional full Git object ids bind a record to declared base/subject commits and a verified subject tree for local human review; bound deterministic evidence remains unsatisfied unless at least one conservative path-shaped command operand resolves in that tree."
  supersession_rule: "A successor record may reference one earlier same-AC record; the predecessor remains present and visible."
  non_claim: "This manifest does not prove command execution, clean or independent execution, signing, identity, AC correctness, implementation correctness, complete coverage, approval, certification, or compliance."

completions: []

