    warning_if_enabled_too_early: "Brownfield projects may initially see many missing or legacy headers."
    consequence_if_deferred: "Source-to-requirement/task traceability stays informal and harder to review."
    dependency_posture: "deterministic Python source review"
    noise_risk: medium
    human_review_boundary: "Rationale quality and source ownership remain human review decisions."
    not_claimed:
      - "code correctness"
      - "complete source traceability"
    related_capabilities: [CAP-MODULE-HEADER-TRACEABILITY]
    related_reports:
      - "naos/reports/module_header_traceability.json"
    related_docs:
