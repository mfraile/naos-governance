    why_recommended: "Requirement, task, and source traceability can drift independently when specs, task registry entries, source headers, source spec references, or source roots change."
    benefit: "Surfaces orphan headers, stale statuses, uncovered requirements, overloaded requirements, unresolved source spec references, and untraced source as review evidence."
    prerequisites:
      - "specs/03-requirements.md"
      - "naos/TASK_REGISTRY.yaml"
      - "Configured/inferred source roots or source module headers"
    evidence_outputs:
      - "naos/reports/spec_pack_contract.json"
      - "naos/reports/spec_cascade_coherence.json"
    commands:
      - "naos spec-pack-contract --profile <profile>"
      - "naos spec-cascade --profile <profile>"
    warning_if_enabled_too_early: "Projects without specs, tasks, or source traceability may see advisory missing/not-configured findings."
    consequence_if_deferred: "Requirement/task/source drift may stay hidden until gates, reviews, or audits ask for traceability evidence."
    dependency_posture: "deterministic file-first"
    noise_risk: medium
    human_review_boundary: "Humans decide whether cascade gaps are defects, accepted gaps, waivers, or next-action items."
    not_claimed:
      - "complete traceability proof"
      - "code correctness"
      - "runtime behavior proof"
      - "approval or certification"
    related_capabilities: [CAP-SPEC-CASCADE-COHERENCE]
    related_reports:
      - "naos/reports/spec_cascade_coherence.json"
    related_docs:
      - "docs/CONTROL_PLANE.md"
      - "docs/CLAIMS_AND_LIMITATIONS.md"
    next_actions:
      - "Run after spec, task, module-header, or source-root changes; route findings to remediation, waiver, or residual risk."

  - id: control_plane_review_routing
