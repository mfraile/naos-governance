  - id: spec_cascade_coherence
    name: "Spec Cascade Coherence"
    category: "source traceability"
    status: active
    installable: false
    requires_confirmation: false
    not_addable_reason: "Spec-pack contract and spec-cascade coherence are core validator/report surfaces; no additional setup seed is required beyond specs, task registry, module headers, and configured/inferred source roots."
    install_actions: []
    post_install_next_actions:
      - "Run naos spec-pack-contract --profile <profile> and naos spec-cascade --profile <profile> when specs, task registry entries, module headers, source spec references, or source traceability changed."
    profile_default:
      quickstart: optional
      lite: optional
      standard: recommended
      assured: recommended
    recommended_profiles: [standard, assured]
