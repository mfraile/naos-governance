version: "1.0"
semantics:
  catalog: "Adopter-facing setup module catalogue; this file is configuration, not proof."
  recommendation: "NAOS evaluates profile and simple project signals to recommend, defer, or keep modules optional."
  governance_decision: "Humans decide which modules to enable, defer, approve, or treat as residual risk."
  flow: "choice -> rationale -> benefit -> warning -> consequence -> next action"
  not_claimed:
    - "automatic setup"
    - "automatic profile selection"
    - "automatic maturity promotion"
    - "certification"
    - "legal or regulatory compliance"

modules:
  - id: profile_baseline
    name: "Profile Baseline"
    category: "onboarding"
    status: active
    installable: true
    requires_confirmation: false
    not_addable_reason: ""
    install_actions:
      - type: repair_seed
        source: "templates/structural-seeds/naos/setup_module_catalog.yaml"
        destination: "naos/setup_module_catalog.yaml"
        copy_mode: file
        overwrite: skip
        profiles: [quickstart, lite, standard, assured]
        explanation: "Repair or add the adopter-local setup module catalog used by setup recommendations and guided module additions."
        post_install_next_actions:
          - "Run naos-governance setup-recommendations --profile <profile>."
    post_install_next_actions:
      - "Review naos/setup_module_catalog.yaml before enabling additional modules."
    profile_default:
      quickstart: recommended
      lite: recommended
      standard: recommended
      assured: recommended
    recommended_profiles: [quickstart, lite, standard, assured]
    project_signals: [selected_profile]
    why_recommended: "Every adopter needs an explicit profile baseline before interpreting severity, evidence, gates, and dashboard output."
    benefit: "Sets expectations for advisory, warning, required, or blocking behavior without pretending profile equals maturity."
    prerequisites: []
    evidence_outputs:
      - "selected NAOS profile"
    commands:
      - "naos-governance setup-recommendations --profile <profile>"
    warning_if_enabled_too_early: "None; this is low-noise orientation."
    consequence_if_deferred: "Teams may confuse profile strictness with adopter maturity."
    dependency_posture: "deterministic file-first"
    noise_risk: low
    human_review_boundary: "Project governance chooses the profile and can revise it as evidence and risk posture change."
    not_claimed:
      - "automatic profile selection"
      - "maturity approval"
    related_capabilities: [CAP-ADOPTER-SETUP-RECOMMENDATIONS]
    related_reports:
      - "naos/reports/setup_recommendations.json"
    related_docs:
      - "INSTALLATION_MANUAL.md"
      - "docs/ADOPTION_GUIDE.md"
    next_actions:
      - "Select quickstart, lite, standard, or assured based on friction tolerance and review obligations."

  - id: professional_adoption_engine
    name: "Professional Adoption Engine"
    category: "onboarding"
    status: active
    installable: true
    requires_confirmation: false
    not_addable_reason: ""
    install_actions:
      - type: repair_seed
        source: "templates/structural-seeds/naos/intake_answers.yaml"
        destination: "naos/intake_answers.yaml"
        copy_mode: file
        overwrite: skip
        profiles: [quickstart, lite, standard, assured]
        explanation: "Add the answer-file seed used by professional adoption intake."
        post_install_next_actions:
          - "Run naos preflight --profile <profile>."
          - "Run naos intake --answers naos/intake_answers.yaml --profile <profile>."
    post_install_next_actions:
      - "Run naos adopt --mode greenfield --profile <profile> for new projects or naos adopt --mode brownfield --profile <profile> for existing projects."
    profile_default:
      quickstart: optional
      lite: recommended
      standard: recommended
      assured: recommended
    recommended_profiles: [lite, standard, assured]
    project_signals: [selected_profile, brownfield_like, has_ai_surfaces, has_memory_context]
    why_recommended: "Professional adoption connects preflight, intake, inventories, install plan, challenge reports, baselines, and decision records before activation."
    benefit: "Prevents isolated setup commands from becoming ghost capabilities by keeping source, reports, schemas, docs, evidence outputs, and human decisions aligned."
    prerequisites:
      - "Generated NAOS kit files"
    evidence_outputs:
      - "naos/reports/adoption_summary.json"
      - "naos/reports/preflight_report.json"
      - "naos/reports/intake_report.json"
      - "naos/reports/install_plan.json"
      - "naos/reports/install_decision_record.json"
    commands:
      - "naos adopt --mode greenfield --profile <profile>"
      - "naos adopt --mode brownfield --profile <profile>"
      - "naos context-challenge --profile <profile>"
    warning_if_enabled_too_early: "Unknown intake answers and unresolved artifact decisions will surface as review-required output."
    consequence_if_deferred: "Teams may install files without a connected inventory, challenge, decision record, or baseline."
    dependency_posture: "deterministic file-first"
    noise_risk: medium
    human_review_boundary: "Humans decide profile, module activation, artifact disposition, memory/MCP posture, candidate requirement promotion, and residual risk."
    not_claimed:
      - "automatic activation"
      - "maturity approval"
      - "legal or regulatory compliance"
      - "requirements completeness"
    related_capabilities: [CAP-ADOPTER-SETUP-RECOMMENDATIONS]
    related_reports:
      - "naos/reports/adoption_summary.json"
      - "naos/reports/install_decision_record.json"
    related_docs:
      - "INSTALLATION_MANUAL.md"
      - "docs/ADOPTION_GUIDE.md"
      - "docs/tutorials/PROFESSIONAL_ADOPTION_ENGINE.md"
    next_actions:
      - "Run preflight, intake, inventories, challenge reports, and install-decision record before durable activation."

  - id: project_context_specs
    name: "Project Context & Specs"
    category: "project context"
    status: active
    installable: false
    requires_confirmation: false
    not_addable_reason: "Project context and specs are project-authored artifacts; add optional spec templates with naos add spec <number> and adapt them to the project."
    install_actions: []
    post_install_next_actions:
      - "Use naos add spec 05 --dry-run or author project specs directly, then run naos systemic-impact."
    profile_default:
      quickstart: optional
      lite: optional
      standard: recommended
      assured: recommended
    recommended_profiles: [standard, assured]
    project_signals: [has_specs, brownfield_like, regulated_posture_requested]
    why_recommended: "Specs and context help tie decisions, tasks, tests, claims, and evidence to explicit project intent."
    benefit: "Reduces ambiguity when humans and AI agents assess what should change and what should remain stable."
    prerequisites:
      - "Project scope or problem statement"
    evidence_outputs:
      - "specs/*.md"
      - "naos/TRACEABILITY_MATRIX.md"
    commands:
      - "naos systemic-impact --profile <profile>"
      - "naos roadmap-crosswalk --profile <profile>"
    warning_if_enabled_too_early: "Over-specified specs can slow early exploration if the project is still a throwaway prototype."
    consequence_if_deferred: "Later evidence, claims, and task decisions may need extra human context reconstruction."
    dependency_posture: "file-first, project-authored"
    noise_risk: medium
    human_review_boundary: "Product owner or architect approves scope and spec intent."
    not_claimed:
      - "complete requirements quality"
      - "automatic architecture correctness"
    related_capabilities:
      - CAP-SYSTEMIC-IMPACT-REVIEW
      - CAP-ROADMAP-CROSSWALK-VALIDATION
    related_reports:
      - "naos/reports/systemic_impact_review.json"
      - "naos/reports/roadmap_crosswalk_validation.json"
    related_docs:
      - "docs/CONTROL_PLANE.md"
      - "docs/tutorials/INTEGRAL_TUTORIAL_STANDARD_FROM_SCRATCH.md"
    next_actions:
      - "Keep project specs lightweight at first, then add traceability as the project matures."

  - id: capability_maturity_readiness
    name: "Capability Maturity Readiness"
    category: "maturity"
    status: active
    installable: true
    requires_confirmation: false
    not_addable_reason: ""
    install_actions:
      - type: repair_seed
        source: "templates/structural-seeds/naos/capability_state.yaml"
        destination: "naos/capability_state.yaml"
        copy_mode: file
        overwrite: skip
        profiles: [quickstart, lite, standard, assured]
        explanation: "Add the adopter declaration file used by maturity readiness evaluation."
        post_install_next_actions:
          - "Edit owners, target maturity, evidence roots, and waivers before treating the report as review evidence."
          - "Run naos capability-maturity --profile <profile>."
    post_install_next_actions:
      - "Run naos capability-maturity --profile <profile> after adapting capability_state.yaml."
    profile_default:
      quickstart: optional
      lite: recommended
      standard: recommended
      assured: recommended
    recommended_profiles: [lite, standard, assured]
    project_signals: [has_naos_state, regulated_posture_requested]
    why_recommended: "Capability state separates adopter declarations from NAOS readiness evaluation and human maturity decisions."
    benefit: "Shows enabled, disabled, missing, stale, waived, and human-review-required maturity signals."
    prerequisites:
      - "naos/capability_state.yaml"
    evidence_outputs:
      - "naos/reports/capability_maturity.json"
    commands:
      - "naos capability-maturity --profile <profile>"
    warning_if_enabled_too_early: "Without owners or evidence, standard/assured profiles may surface many readiness gaps."
    consequence_if_deferred: "Teams may lack a structured path for understanding capability maturity readiness."
    dependency_posture: "deterministic file-first"
    noise_risk: low
    human_review_boundary: "NAOS evaluates readiness; project governance approves maturity movement."
    not_claimed:
      - "automatic promotion"
      - "maturity certification"
    related_capabilities: [CAP-ADOPTER-SETUP-RECOMMENDATIONS]
    related_reports:
      - "naos/reports/capability_maturity.json"
    related_docs:
      - "docs/CONTROL_PLANE.md"
      - "templates/structural-seeds/naos/NAOS_QUICK_REFERENCE.md"
    next_actions:
      - "Run the report, review missing evidence, and decide which capabilities should mature next."

  - id: systemic_impact_review
    name: "Systemic Impact Review"
    category: "coherence"
    status: active
    installable: true
    requires_confirmation: false
    not_addable_reason: ""
    install_actions:
      - type: repair_seed
        source: "templates/structural-seeds/naos/systemic_impact_rules.yaml"
        destination: "naos/systemic_impact_rules.yaml"
        copy_mode: file
        overwrite: skip
        profiles: [quickstart, lite, standard, assured]
        explanation: "Add configurable artifact-family rules for systemic impact and coherence review."
        post_install_next_actions:
          - "Customize artifact families and review obligations for the adopter project."
          - "Run naos systemic-impact --profile <profile>."
          - "For stable change closure, repeat --changed-path <repo-relative-path> for the exact changed files, disposition every obligation, and rerun with --review-record <yaml> --require-resolved."
    post_install_next_actions:
      - "Run naos systemic-impact --profile <profile> after reviewing rules."
    profile_default:
      quickstart: optional
      lite: recommended
      standard: recommended
      assured: recommended
    recommended_profiles: [lite, standard, assured]
    project_signals: [has_specs, has_ai_surfaces, has_ci, has_naos_state]
    why_recommended: "Governed artifact families can drift when specs, scripts, policies, prompts, docs, evidence, or dashboards change."
    benefit: "Reports affected families and review obligations without claiming perfect coherence."
    prerequisites:
      - "naos/systemic_impact_rules.yaml"
    evidence_outputs:
      - "naos/reports/systemic_impact_review.json"
    commands:
      - "naos systemic-impact --profile <profile>"
      - "naos systemic-impact --profile <profile> --changed-path <repo-relative-path>"
    warning_if_enabled_too_early: "Advanced artifact families may appear not configured until the project deliberately adopts them."
    consequence_if_deferred: "Review obligations may stay implicit and be missed during BAU changes."
    dependency_posture: "deterministic file-first"
    noise_risk: medium
    human_review_boundary: "Humans decide remediation, waiver, residual risk, and next action."
    not_claimed:
      - "guaranteed coherence"
      - "complete impact analysis"
      - "automatic Git diff inference"
      - "automatic artifact updates or approval"
    related_capabilities: [CAP-SYSTEMIC-IMPACT-REVIEW]
    related_reports:
      - "naos/reports/systemic_impact_review.json"
    related_docs:
      - "docs/SYSTEMIC_CAPABILITY_WIRING.md"
    next_actions:
      - "Customize artifact-family rules as the project moves from onboarding to BAU execution."

  - id: module_header_traceability
