schema: naos.challenge_rules.v1
profile: quickstart
updated_at: null
contract_role: descriptive_reference
runtime_configurable: false
# This seed documents producer behavior. Editing it does not change runtime
# evaluation, activation boundaries or mandatory human review.
description: >
  Reference for challenge-before-build reports. These commands enumerate local
  file-path signals and review questions; they do not evaluate source contents,
  plans, gate decisions or previous reports.
modes:
  - install
  - greenfield
  - brownfield
  - requirements
  - architecture
  - task
  - implementation-plan
  - evidence
  - gate
  - decision
  - remediation
required_report_fields:
  - evidence_used
  - facts_confirmed
  - assumptions_detected
  - inferred_candidates
  - missing_information
  - contradictions
  - risks
  - decisions_required
  - no_edit_confirmation
  - human_review_boundary
not_claimed:
  - automatic approval
  - requirements completeness proof
  - runtime safety proof
  - behavioral correctness proof
  - source truth proof
  - human review replacement
human_review_required: true
