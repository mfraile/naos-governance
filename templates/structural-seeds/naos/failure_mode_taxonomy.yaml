network_calls_allowed: false
tool_mutation_allowed: false
gate_blocking_enabled: false
assured_blocking_enabled: false
behavioral_battery_execution: false
opencode_runtime_enabled: false
capability_maturity: L1

profile_posture:
  quickstart:
    state: optional
    severity: advisory
    human_review_required: false
    notes: "Optional local failure-mode posture hints only."
  lite:
    state: optional
    severity: warning
    human_review_required: false
    notes: "Warn when configured posture evidence is missing, stale, or overclaimed."
  standard:
    state: optional
    severity: required
    human_review_required: true
    notes: "Route configured failure-mode posture gaps to human review."
  assured:
    state: optional
    severity: required
    human_review_required: true
    notes: "First implementation slice remains required review only; blocking requires future validated L3+ maturity and gate wiring."

