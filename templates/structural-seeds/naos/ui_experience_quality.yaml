version: 1
enabled: false
ui_quality_declared: false
design_stage: concept_exploration
runtime_enabled: false
mcp_allowed: false
figma_api_allowed: false
browser_automation_allowed: false
design_tool_calls_allowed: false
external_generator_authority: false
model_judgement_authority: false
tool_mutation_allowed: false
capability_maturity: L1

profile_posture:
  quickstart:
    state: optional
    severity: advisory
    notes: "Optional UI quality evidence hints only."
  lite:
    state: optional
    severity: warning
    notes: "Warn when configured UI quality evidence is missing."
  standard:
    state: optional
    severity: required
    notes: "Route configured UI quality evidence gaps to human review."
  assured:
    state: optional
    severity: required
    notes: "First implementation slice remains required review only; blocking requires future validated L3+ maturity and gate wiring."

# Enable only for projects that want local UI/UX quality evidence review.
# This file is a declaration and evidence index, not a design judge.
