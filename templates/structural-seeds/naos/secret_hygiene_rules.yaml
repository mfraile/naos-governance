schema: naos.secret_hygiene_rules.v1
mode: deterministic_local
include_root_files: true
# Default scans configured polyglot text across the project; exclusions stay explicit.
scan_roots:
  - .
suffixes:
  - .py
  - .yaml
  - .yml
  - .json
  - .jsonl
  - .toml
  - .env
  - .ini
  - .cfg
  - .conf
  - .md
  - .txt
  - .ts
  - .tsx
  - .js
  - .jsx
  - .mjs
  - .cjs
  - .java
  - .kt
  - .kts
  - .go
  - .cs
  - .rb
  - .php
  - .sh
  - .bash
  - .ps1
  - .tf
  - .tfvars
  - .hcl
  - .properties
  - .xml
  - .gradle
  - .pem
  - .key
exclude_dirs:
  - dev
  - dist
  - build
  - __pycache__
exclude_globs: []
entropy_min_length: 20
entropy_threshold: 4.0
allowed_values: []
# Digest-bound public declarations are recognized separately; no kit literals
# are seeded into an adopter-owned allowlist. Additional exceptions need review.
entropy_allowed_values: []
human_review_required: true
not_claimed:
  - secret-free repository proof
  - credential rotation
  - complete secret scanning
  - supply-chain assurance
  - approval
  - human review replacement
