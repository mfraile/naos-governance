version: "1.0"
# Gate convergence note:
# Gates should consume the relevant implemented reports and identify missing,
# not_configured, stale, waived, residual-risk, and experimental evidence honestly.
# They are convergence points for preventive review, detective validators,
# governance-surface self-review, systemic impact/coherence review, spec-readiness
# routing, research feedback, evidence-pack decisions, and dashboard posture. This
# manifest does not claim
# every input is fully automated; profile policy and implemented validators decide
# enforcement.
profile_order:
  - quickstart
  - lite
  - standard
  - assured

gates:
  - id: G0
    name: "Install Readiness"
    purpose: "Confirm the project has enough NAOS scaffold to run advisory checks."
    profile_behavior:
      quickstart: "Advisory install check only."
      lite: "Warn when expected guardrail files are missing."
      standard: "Require install readiness evidence for governed workflow."
      assured: "Block when core install evidence is missing."
    required_inputs:
      - ".ai/RULES.md"
    required_evidence:
      - "naos/maturity_levels.yaml"
    validators:
      - id: naos_readiness
        script: scripts/naos_readiness.py
        status: available
    outputs:
      - "naos/reports/gate_status.json"
    severity_by_profile:
      quickstart: advisory
      lite: warning
      standard: required
      assured: blocking
    maturity_dependency:
      capability: CAP-GATEKEEPER-MANIFEST
      minimum_maturity: L1
    known_limitations:
      - "Source kit checks may use template fallback instead of generated-project files."

  - id: G1
    name: "Context Readiness"
    purpose: "Confirm AI-context, governance rules, and project orientation files are present."
    profile_behavior:
      quickstart: "Advisory context reminder."
      lite: "Warn when context files are incomplete."
      standard: "Require configured context before governed work."
      assured: "Block when configured context evidence is missing."
    required_inputs:
      - ".ai/RULES.md"
      - "CLAUDE.md"
    required_evidence:
      - "naos/PROJECT_STATUS.md"
    validators:
      - id: project_coherence
        script: scripts/validators/validate_project_coherence.py
        status: available
    outputs:
      - "naos/reports/gate_status.json"
    severity_by_profile:
      quickstart: advisory
      lite: warning
      standard: required
      assured: blocking
    maturity_dependency:
      capability: CAP-SELF-CONFORMANCE
      minimum_maturity: L1
    known_limitations:
      - "Projects may use equivalent context files; configure manifest paths accordingly."

  - id: G2
    name: "Planning Gate"
    purpose: "Confirm task planning, roadmap linkage, and spec-readiness routing exist before implementation."
    profile_behavior:
      quickstart: "Advisory planning guidance."
      lite: "Warn when planning evidence is missing."
      standard: "Require planning evidence for normal SDLC work."
      assured: "Block when planning evidence is missing."
    required_inputs:
      - "naos/TASK_REGISTRY.yaml"
      - "naos/PLANNING_BASELINES.yaml"
    required_evidence:
      - "naos/reports/roadmap_crosswalk_validation.json"
      - "naos/reports/systemic_impact_review.json"
      - "naos/reports/control_plane_review.json"
      - "naos/reports/ai_surface_context_budget.json"
      - "naos/reports/memory_context_readiness.json"
      - "naos/reports/memory_provider_access.json"
      - "naos/reports/memory_use_policy.json"
      - "naos/reports/learning_loop_review.json"
      - "naos/reports/task_context_pack.json"
      - "naos/reports/local_context_index.json"
      - "naos/reports/local_context_query.json"
      - "naos/reports/semantic_candidate_layer.json"
      - "naos/reports/graph_context_readiness.json"
      - "naos/reports/graph_context_query.json"
      - "naos/reports/session_lifecycle.json"
      - "naos/reports/plan_coherence.json"
    semantic_requirements:
      - id: current_implementation_readiness
        source: plan_coherence_live
        field: implementation_readiness.status
        allowed_values: [ready]
        profiles: [lite, standard, assured]
    validators:
      - id: task_registry
        script: scripts/naos_validate_task_registry.py
        status: available
      - id: roadmap_crosswalk
        script: scripts/naos_validate_roadmap_crosswalk.py
        status: available
      - id: systemic_impact_review
        script: scripts/naos_systemic_impact.py
        status: available
      - id: control_plane_review_routing
        script: scripts/naos_control_plane_review.py
        status: available
      - id: ai_surface_context_budget
        script: scripts/naos_ai_surface_budget.py
        status: available
      - id: memory_context_readiness
        script: scripts/naos_memory_context_readiness.py
        status: available
      - id: memory_provider_access
        script: scripts/naos_memory_provider_access.py
        status: available
      - id: memory_use_policy
        script: scripts/naos_memory_use_policy.py
        status: available
      - id: learning_loop_review
        script: scripts/naos_learning_loop_review.py
        status: available
      - id: task_context_pack
        script: scripts/naos_task_context_pack.py
        status: available
      - id: local_context_index
        script: scripts/naos_local_context_index.py
        status: available
      - id: local_context_query
        script: scripts/naos_local_context_query.py
        status: available
      - id: semantic_candidate_layer
        script: scripts/naos_semantic_candidate_readiness.py
        status: available
      - id: graph_context_readiness
        script: scripts/naos_graph_context_readiness.py
        status: available
      - id: graph_context_query
        script: scripts/naos_graph_context_query.py
        status: available
      - id: session_lifecycle
        script: scripts/naos_session_lifecycle.py
        status: available
      - id: plan_coherence
        script: scripts/naos_plan_coherence.py
        status: available
    outputs:
      - "naos/reports/roadmap_crosswalk_validation.json"
      - "naos/reports/systemic_impact_review.json"
      - "naos/reports/control_plane_review.json"
      - "naos/reports/ai_surface_context_budget.json"
      - "naos/reports/memory_context_readiness.json"
      - "naos/reports/memory_provider_access.json"
      - "naos/reports/memory_use_policy.json"
      - "naos/reports/learning_loop_review.json"
      - "naos/reports/task_context_pack.json"
      - "naos/reports/local_context_index.json"
      - "naos/reports/local_context_query.json"
      - "naos/reports/semantic_candidate_layer.json"
      - "naos/reports/graph_context_readiness.json"
      - "naos/reports/graph_context_query.json"
      - "naos/reports/session_lifecycle.json"
      - "naos/reports/plan_coherence.json"
    severity_by_profile:
      quickstart: advisory
      lite: warning
      standard: required
      assured: blocking
    team_overrides:
      platform:
        severity: warning
        enabled: true
        rationale: "Example static team-scoped posture: platform may route planning evidence through an alternate review cadence. This is governance configuration, not authorization or approval."
        review_required: true
        limitations:
          - "Team overrides cannot prove team membership, authorize work, satisfy separation of duties, or weaken protected ADR-0010: Control-Plane Advisory Boundaries invariants."
    maturity_dependency:
      capability: CAP-ROADMAP-CROSSWALK-VALIDATION
      minimum_maturity: L2
    known_limitations:
      - "Roadmap IDs must be configured for non-NAOS project formats."
      - "Systemic impact review identifies configured review obligations; it does not prove perfect coherence."
      - "Control-plane review routing reports structured governance-surface and research-routing items; it does not prove routing completeness."
      - "Local context index is generated and cache-like; it does not decide truth or replace source artifacts."
      - "Spec 04 readiness is one example of configured impact review, not the entire capability."
      - "Implementation-readiness is evaluated live from the planning-baseline ledger; structural readiness and attributed review do not prove semantic completeness or authorize implementation."

