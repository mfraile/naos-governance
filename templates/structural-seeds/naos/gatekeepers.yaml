      standard: "Advisory only."
      assured: "Warning unless explicitly configured as stronger."
    required_inputs:
      - "task_battery/"
    required_evidence:
      - "naos/reports/behavioral_evaluation.json"
    validators:
      - id: behavioral_evaluation_readiness
        status: manual
        notes: "Future PETRI-compatible scaffold-realistic evaluation."
    outputs:
      - "naos/reports/behavioral_evaluation.json"
    severity_by_profile:
      quickstart: none
      lite: advisory
      standard: advisory
      assured: warning
    maturity_dependency:
      capability: CAP-DIGITAL-TWIN-EVALUATION
      minimum_maturity: L0
    known_limitations:
