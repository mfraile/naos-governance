    known_limitations:
      - "Evidence supports review and admissibility discussions; it does not prove compliance."
      - "Research/autoresearch findings are consumed when represented in implemented reports, known gaps, residual risks, task records, or evidence objects."
      - "Control-plane review routing does not infer routed status from report existence alone."
      - "Evidence attestation uses local digests and reviewer metadata only; it is not cryptographic signing or tamper-proof storage."
      - "Memory readiness evaluates advisory recall and access posture; it does not treat memory as evidence, approval, or source of truth."
      - "Memory-use policy evaluates review metadata, instruction-grade requirements, and recall/audit readiness; it does not write memory, execute recall traces, or make memory authoritative."
      - "Governed learning lifecycle reports metadata and review posture only; they do not write memory, mutate AI surfaces, approve work, or prove semantic truth."
      - "Task context packs are derived, bounded context; they are not source of truth, approval, or complete coherence proof."
      - "Local context index provides bounded retrieval candidates only; source artifacts and deterministic reports remain authoritative."
      - "Graph context readiness records explicit-link traversal guardrails only; graph links are not source of truth or traversal approval."
      - "Hygiene reports reduce obvious deterministic risk classes; they do not prove semantic correctness, secret-free code, meaningful test coverage, API behavior, or package safety."
      - "PR risk classification is PR/review evidence only; it does not approve pull requests, execute sandboxes, perform malware analysis, prove security, prove compliance, or authorize release."
      - "Secure-coding control routing keeps register validity, evidence availability/freshness, mapping state, and human review separate; no blended security score or automatic control verdict is produced."

  - id: G7
