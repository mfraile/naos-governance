schema: naos.traceability_gap_register_rules.v1
profile: quickstart
updated_at: null
contract_role: descriptive_reference
runtime_configurable: false
# This seed documents producer behavior. Editing it does not change runtime
# evaluation, activation boundaries or mandatory human review.
description: >
  Reference for candidate-review obligations and manual baseline review.
  This producer does not analyze requirement-to-code/test links or verify
  truth, ownership or closure of candidate records.
analysis_scope: candidate_review_only
automated_missing_link_detection: false
gap_types:
  - candidate_requires_review
  - baseline_review
# Topics for human review; not gap types automatically detected by this command.
manual_review_topics:
  - requirement_without_code
  - code_without_requirement
  - test_without_requirement
  - behavior_without_owner
  - missing_evidence
  - conflicting_ai_artifact
  - unresolved_memory_mcp_tool_posture
  - unresolved_human_decision
closure_rule: explicit_evidence_or_human_decision_required
not_claimed:
  - requirements completeness proof
  - issue resolution
  - automatic approval
  - human review replacement
human_review_required: true
