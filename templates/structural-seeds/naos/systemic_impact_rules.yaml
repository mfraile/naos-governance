version: "1.0"
semantics:
  state: "Project-configurable artifact-family rules; this file is not evidence by itself."
  report: "NAOS evaluates current configured artifact relationships and review obligations."
  governance_decision: "Human/project governance decides remediation, waiver, and maturity actions."
  not_claimed:
    - "automatic consistency proof"
    - "guaranteed coherence"
    - "complete impact analysis"
    - "automatic dependency updates"
    - "certification"

defaults:
  freshness_window_days: 30
  severity_by_profile:
    quickstart: advisory
    lite: warning
    standard: required
    assured: blocking

# Review surfaces are named human-review destinations, not fabricated
# file-backed artifact families. They make relationship intent explicit without
# claiming that a path match proves semantic completeness.
review_surfaces:
  - {surface_id: agent_orchestration_plan, name: "Opt-in agent orchestration proposal", kind: artifact_review, description: "Review the optional proposal contract, deterministic output, and human-gated handoff boundary."}
  - {surface_id: ai_artifact_inventory, name: "AI artifact inventory", kind: artifact_review, description: "Review the declared inventory of AI-facing artifacts."}
  - {surface_id: ai_component_inventory, name: "Declared AI component inventory", kind: evidence, description: "Review the custom declared-facts inventory, provenance, freshness, and G2/G6 routing non-claims."}
  - {surface_id: agent_sponsor_registry, name: "Agent sponsor registry", kind: evidence, description: "Review the opt-in build-time sponsor, ownership, registry-expiry, credential-posture, and G2/G6 non-claims."}
  - {surface_id: aivss_arithmetic_verification, name: "AIVSS arithmetic verification", kind: evidence, description: "Review the opt-in pinned-v0.8 arithmetic, integrity evidence, G2/G6 prompts, and non-authorizing boundary."}
  - {surface_id: ai_surfaces, name: "AI surfaces", kind: artifact_review, description: "Review prompts, instructions, agents, skills, and catalogues."}
  - {surface_id: autoresearch_readiness, name: "Autoresearch readiness", kind: decision, description: "Review whether autoresearch prerequisites and boundaries remain accurate."}
  - {surface_id: code, name: "Implementation code", kind: artifact_review, description: "Review affected implementation modules and callers."}
  - {surface_id: commands, name: "Commands", kind: artifact_review, description: "Review CLI, Make, workflow, and prompt command surfaces."}
  - {surface_id: context_challenge, name: "Context challenge", kind: decision, description: "Review context-challenge evidence and next action."}
  - {surface_id: decision_probe, name: "Decision probe", kind: decision, description: "Review decision-probe evidence and disposition."}
  - {surface_id: design_traceability, name: "Design traceability", kind: artifact_review, description: "Review design-to-requirement and design-to-source links."}
  - {surface_id: deterministic_conformance, name: "Deterministic conformance", kind: evidence, description: "Review deterministic conformance evidence."}
  - {surface_id: docs, name: "Documentation", kind: artifact_review, description: "Review public and operator documentation affected by the change."}
  - {surface_id: evidence_pack, name: "Evidence pack", kind: evidence, description: "Review evidence-pack inclusion and non-claims."}
  - {surface_id: existing_resource_inventory, name: "Existing-resource inventory", kind: evidence, description: "Review declared existing project resources."}
  - {surface_id: failure_mode_posture, name: "Failure-mode posture", kind: evidence, description: "Review affected failure-mode observations and posture."}
  - {surface_id: gate_evaluation, name: "Gate evaluation", kind: evidence, description: "Review gate-evaluation consumption and output."}
  - {surface_id: gate_status, name: "Gate status", kind: evidence, description: "Review gate-status consumption and output."}
  - {surface_id: gates, name: "Gates", kind: decision, description: "Review affected gate configuration and human decision boundaries."}
  - {surface_id: generated_adopter_artifacts, name: "Generated adopter artifacts", kind: artifact_review, description: "Review portable files emitted or installed into adopter repositories."}
  - {surface_id: guided_intake, name: "Guided intake", kind: operation, description: "Review guided-intake workflow and operator instructions."}
  - {surface_id: install_decision_record, name: "Install decision record", kind: decision, description: "Review explicit installation decisions and evidence."}
  - {surface_id: install_plan, name: "Install plan", kind: decision, description: "Review planned installation actions and boundaries."}
  - {surface_id: limitations, name: "Limitations", kind: boundary, description: "Review known limitations and non-claims."}
  - {surface_id: mcp_resource_inventory, name: "MCP resource inventory", kind: integration, description: "Review declared MCP resources without activating them."}
  - {surface_id: memory_context, name: "Memory context", kind: boundary, description: "Review memory context, authority, and privacy boundaries."}
  - {surface_id: memory_resource_inventory, name: "Memory resource inventory", kind: integration, description: "Review declared memory resources without activating them."}
  - {surface_id: model_provider_policy, name: "Model/provider policy", kind: boundary, description: "Review provider and model policy without making external calls."}
  - {surface_id: model_telemetry_evidence, name: "Model telemetry evidence", kind: evidence, description: "Review declared telemetry evidence and non-claims."}
  - {surface_id: next_actions, name: "Next actions", kind: decision, description: "Record the human-owned next action for open findings."}
  - {surface_id: optional_integrations, name: "Optional integrations", kind: integration, description: "Review optional-integration posture and activation boundaries."}
  - {surface_id: parallel_lane_handoff, name: "Parallel lane handoff", kind: evidence, description: "Review declared lane handoff records and preserved incomplete or blocked evidence."}
  - {surface_id: plan_challenge, name: "Plan challenge", kind: decision, description: "Review plan-challenge findings and disposition."}
  - {surface_id: planning_gate_review, name: "Planning gate review", kind: decision, description: "Review planning-gate evidence and human decision."}
  - {surface_id: policy, name: "Policy surface", kind: artifact_review, description: "Review policy text and its runtime consumers."}
  - {surface_id: preflight, name: "Preflight", kind: evidence, description: "Review preflight commands and observed results."}
  - {surface_id: privacy, name: "Privacy boundary", kind: boundary, description: "Review privacy and data-handling impact."}
  - {surface_id: release_gates, name: "Release gates", kind: decision, description: "Review release-readiness gates without authorizing release."}
  - {surface_id: repo_context_challenge, name: "Repository context challenge", kind: decision, description: "Review repository-context challenge evidence."}
  - {surface_id: reports, name: "Reports", kind: artifact_review, description: "Review affected report producers, schemas, and consumers."}
  - {surface_id: roadmap_crosswalk, name: "Roadmap crosswalk", kind: artifact_review, description: "Review roadmap and remediation crosswalk status."}
  - {surface_id: sarif_export, name: "SARIF export", kind: artifact_review, description: "Review SARIF transformation and schema compatibility."}
  - {surface_id: sarif_findings_export, name: "SARIF findings export", kind: evidence, description: "Review exported SARIF findings and preserved limitations."}
  - {surface_id: schemas, name: "Schemas", kind: artifact_review, description: "Review schemas, validators, fixtures, and consumers."}
  - {surface_id: security, name: "Security boundary", kind: boundary, description: "Review security impact and enforcement evidence."}
  - {surface_id: sessions, name: "Sessions", kind: artifact_review, description: "Review session lifecycle and evidence artifacts."}
  - {surface_id: setup_module_catalogue, name: "Setup module catalogue", kind: artifact_review, description: "Review setup catalogue entries and generated installation behavior."}
  - {surface_id: systemic_impact, name: "Systemic impact", kind: artifact_review, description: "Review systemic-impact rules, implementation, report, and closure evidence."}
  - {surface_id: task_registry, name: "Task registry", kind: artifact_review, description: "Review task registry and traceability effects."}
  - {surface_id: templates, name: "Templates", kind: artifact_review, description: "Review canonical template sources separately from adopter copies."}
  - {surface_id: test_evidence, name: "Test evidence", kind: evidence, description: "Review executed test evidence and preserved failures."}

changed_path_routing:
  semantics:
    kit_source: "source_patterns classify NAOS-governance development and canonical kit artifacts; they are not adopter installation content by implication."
    adopter_generated: "generated_patterns classify portable project files emitted or explicitly installed into adopter repositories."
    not_claimed: "Matching either role does not prove semantic completeness, installation, activation, approval, or release readiness."
  governed_patterns:
    - "**"
  exclusions:
    - patterns:
        - ".github/CODEOWNERS"
        - ".github/FUNDING.yml"
        - ".github/ISSUE_TEMPLATE/**"
      reason: "Repository-hosting administration is explicit metadata, not a NAOS governance-kit or generated-adopter control surface."
  routing_families:
    - route_id: route_cli_build_package
      name: "CLI, build, installation, and package surfaces"
      source_patterns:
        - "__init__.py"
        - "__main__.py"
        - "cli.py"
        - "naos_*.py"
        - "secure_coding_reporting_cli.py"
        - "naos_governance/**/*.py"
        - "upgrade_contract/**/*.py"
        - "pyproject.toml"
        - "requirements*.txt"
        - "MANIFEST.in"
        - "setup.cfg"
        - "setup.py"
        - "templates/Makefile*.naos"
        - "templates/Makefile.naos*"
      generated_patterns:
        - "Makefile.naos*"
        - "naos_governance/**/*.py"
      review_triggers: [cli_build_or_install_change]
      targets: [scripts, tests, package_install_artifacts, manuals, quick_reference, release_gates, schemas]
      required_review_outputs:
        - "Review CLI help, dispatch, generated Make targets, package contents, installed-console behavior, docs, and tests."

    - route_id: route_scripts
      name: "Runtime and report scripts"
      source_patterns:
        - "scripts/**/*.py"
        - "autoresearch/**/*.py"
      generated_patterns:
        - "scripts/**/*.py"
        - ".github/autoresearch/**"
        - "reports/**"
      review_triggers: [script_or_report_producer_change]
      targets: [validators, tests, schemas, reports, evidence_pack, dashboard, docs]

    - route_id: route_validators
      name: "Validators and deterministic checks"
      source_patterns:
        - "scripts/validators/**/*.py"
        - "**/validate_*.py"
        - "**/scripts/validate_*.py"
      generated_patterns:
        - "scripts/validators/**/*.py"
      review_triggers: [validator_change]
      targets: [tests, schemas, capabilities, policies, evidence, docs]

    - route_id: route_workflows_hooks
      name: "Workflows, hooks, and automation"
      source_patterns:
        - ".github/workflows/**"
        - ".github/run_test_shard.py"
        - ".github/test-duration-baseline.json"
        - "templates/workflows/**"
        - "plugins/**/hooks/**"
        - "templates/integrations/**/hooks/**"
      generated_patterns:
        - ".github/workflows/**"
        - ".claude/hooks/**"
        - ".githooks/**"
      review_triggers: [workflow_hook_or_automation_change]
      targets: [workflows, tests, security, docs, release_gates]

    - route_id: route_schemas
      name: "Schemas and structured contracts"
      source_patterns:
        - "schemas/**"
        - "**/schemas/**"
      generated_patterns:
        - "schemas/**"
        - "naos/schemas/**"
      review_triggers: [schema_contract_change]
      targets: [schemas, validators, tests, generated_adopter_artifacts, docs]

    - route_id: route_configuration_policy_profiles
      name: "Configuration, policy, and profile sources"
      source_patterns:
        - "configs/**"
        - "policies/**"
        - "profiles/**"
        - "templates/profiles/**"
      generated_patterns:
        - "configs/**"
        - "naos/policy/**"
        - "naos/*policy*.yaml"
        - "naos/*rules*.yaml"
        - "naos/capability_state.yaml"
        - ".ai/RULES.md"
        - ".github/profiles/**"
      review_triggers: [configuration_policy_or_profile_change]
      targets: [policies, validators, schemas, tests, docs, generated_adopter_artifacts]

    - route_id: route_structural_seeds
      name: "Structural seeds and generated-project inputs"
      source_patterns:
        - "templates/structural-seeds/**"
        - "templates/spec-kit/**"
        - "templates/instruction-triple/**"
        - "templates/rules-chain/**"
        - "templates/cursor-rules/**"
        - "templates/instincts/**"
        - "archetypes/**"
      generated_patterns:
        - "naos/**"
        - "specs/**"
        - ".cursor/**"
        - ".ai/**"
        - ".github/instincts/**"
        - "CLAUDE.md"
        - ".github/copilot-instructions.md"
        - "PROJECT_CONTEXT.md"
      review_triggers: [structural_seed_or_generated_surface_change]
      targets: [templates, generated_adopter_artifacts, validators, tests, docs]

    - route_id: route_agents_handoffs
      name: "Agent manifests and handoff contracts"
      source_patterns:
        - "templates/agents/**"
        - "configs/naos_ai_surface_catalogue.yaml"
        - "templates/structural-seeds/naos/*handoff*.yaml"
      generated_patterns:
        - ".github/agents/**"
        - "naos/*handoff*.yaml"
      review_triggers: [agent_manifest_or_handoff_change]
      targets: [agents, ai_surface_catalogue, ai_surface_context_budget, skills, instructions, tests, docs, security]

    - route_id: route_agent_orchestration_plan
      name: "Opt-in agent orchestration proposal"
      source_patterns:
        - "templates/integrations/agent-orchestration-plan/**"
        - "scripts/naos_agent_orchestration_plan.py"
        - "schemas/naos/agent_orchestration_*.schema.json"
        - "schemas/naos/human_decision_record.schema.json"
        - "templates/structural-seeds/naos/human_decisions/_TEMPLATE.yaml"
        - "templates/structural-seeds/naos/model_provider_policy.yaml"
        - "capabilities/governed_agentic_coding_workflow.yaml"
        - "capabilities/model_provider_policy.yaml"
      generated_patterns:
        - "naos/agent_orchestration_policy.yaml"
        - "naos/agent_orchestration_request.yaml"
        - "scripts/naos_agent_orchestration_plan.py"
        - "schemas/naos/agent_orchestration_*.schema.json"
        - "naos/human_decisions/DECISION-RUN-*.yaml"
        - "naos/reports/agent_orchestration_plan.json"
      review_triggers: [agent_orchestration_plan_change]
      targets: [agent_orchestration_plan, model_provider_policy, plan_coherence, task_registry, setup_module_catalogue, generated_adopter_artifacts, schemas, tests, docs, commands, security, limitations]
      required_review_outputs:
        - "Verify the optional Assured installer remains create-only, confirmed, and absent from every default generated profile."
        - "Run focused model/effort, task dependency/priority/wave, Git snapshot/digest, client contract, and human-decision tests."
        - "Preserve proposal-only status and prohibit automatic launch, configuration writes, task/claim mutation, closure, approval, merge, push, release, publication, hook, worktree, provider/model, or memory action."

    - route_id: route_ai_component_inventory
      name: "Declared AI component inventory and control-plane consumer"
      source_patterns:
        - "scripts/naos_ai_component_inventory.py"
        - "schemas/naos/ai_component_inventory*.schema.json"
        - "templates/structural-seeds/naos/ai_component_inventory_rules.yaml"
        - "capabilities/ai_component_inventory.yaml"
        - "scripts/naos_control_plane_review.py"
        - "schemas/naos/control_plane_review.schema.json"
        - "templates/structural-seeds/naos/control_plane_review_rules.yaml"
      generated_patterns:
        - "scripts/naos_ai_component_inventory.py"
        - "schemas/naos/ai_component_inventory*.schema.json"
        - "naos/ai_component_inventory_rules.yaml"
        - "naos/capabilities/ai_component_inventory.yaml"
        - "naos/reports/ai_component_inventory.json"
        - "naos/reports/control_plane_review.json"
      review_triggers: [ai_component_inventory_contract_change]
      targets: [ai_component_inventory, ai_surfaces, model_provider_policy, control_plane_review, generated_adopter_artifacts, schemas, tests, docs, commands, gates, limitations]
      required_review_outputs:
        - "Verify missing, malformed, stale, content-mismatched, or incomplete required inventory routes to G2/G6 human review."
        - "Verify content digests, not wall-clock age or copied mtimes, determine freshness."
        - "Preserve custom-format non-claims: no CycloneDX/SPDX conformance, runtime discovery, completeness, signing, attestation, supply-chain assurance, compliance approval, release, or publication authority."

    - route_id: route_agent_sponsor_registry
      name: "Opt-in agent sponsor registry and control-plane consumer"
      source_patterns:
        - "scripts/naos_agent_sponsor_registry.py"
        - "schemas/naos/agent_sponsor_registry*.schema.json"
        - "templates/setup-modules/agent_sponsor_registry.yaml"
        - "templates/setup-modules/capabilities/agent_sponsor_registry.yaml"
        - "scripts/naos_control_plane_review.py"
        - "schemas/naos/control_plane_review.schema.json"
        - "templates/structural-seeds/naos/control_plane_review_rules.yaml"
        - "templates/structural-seeds/naos/setup_module_catalog.yaml"
      generated_patterns:
        - "scripts/naos_agent_sponsor_registry.py"
        - "schemas/naos/agent_sponsor_registry*.schema.json"
        - "naos/agent_sponsor_registry.yaml"
        - "naos/capabilities/agent_sponsor_registry.yaml"
        - "naos/reports/agent_sponsor_registry.json"
        - "naos/reports/control_plane_review.json"
      review_triggers: [agent_sponsor_registry_contract_change]
      targets: [agent_sponsor_registry, ai_surfaces, control_plane_review, setup_module_catalogue, generated_adopter_artifacts, schemas, tests, docs, commands, gates, security, limitations]
      required_review_outputs:
        - "Verify the module remains absent from every default generated profile and requires an explicit reviewed dry run plus confirmation."
        - "Verify missing, malformed, stale, expired, secret-bearing, duplicate, orphaned, or exception declarations route to G2/G6 human review."
        - "Verify sponsor refs are sanitized in reports and preserve non-claims for identity, approval, authentication, authorization, credential validation/lifetime, runtime enforcement, signing, attestation, release, and publication."

    - route_id: route_aivss_arithmetic_verification
      name: "Opt-in AIVSS-Agentic v0.8 arithmetic verification and control-plane consumer"
      source_patterns:
        - "scripts/naos_aivss_arithmetic_verification.py"
        - "schemas/naos/aivss_*.schema.json"
        - "templates/setup-modules/aivss_assessments.yaml"
        - "templates/setup-modules/capabilities/aivss_arithmetic_verification.yaml"
        - "scripts/naos_control_plane_review.py"
        - "schemas/naos/control_plane_review.schema.json"
        - "templates/structural-seeds/naos/control_plane_review_rules.yaml"
        - "templates/structural-seeds/naos/setup_module_catalog.yaml"
      generated_patterns:
        - "scripts/naos_aivss_arithmetic_verification.py"
        - "schemas/naos/aivss_*.schema.json"
        - "naos/aivss_assessments.yaml"
        - "naos/capabilities/aivss_arithmetic_verification.yaml"
        - "naos/reports/aivss_arithmetic_verification.json"
        - "naos/reports/control_plane_review.json"
      review_triggers: [aivss_arithmetic_verification_contract_change]
      targets: [aivss_arithmetic_verification, control_plane_review, setup_module_catalogue, generated_adopter_artifacts, schemas, tests, docs, commands, gates, security, limitations]
      required_review_outputs:
        - "Verify the module remains absent from every default profile and requires an explicit reviewed dry run plus confirmation."
        - "Verify exact Decimal intermediates, final round-half-up behavior, all published band boundaries, and the unbanded 0.0 result against independently derived fixtures."
        - "Verify High/Critical score prompts and separate arithmetic/integrity prompts remain fixed advisory G2/G6 review only, with no approval, blocking, prioritization, merge, release, risk acceptance, security, compliance, or publication authority."

    - route_id: route_skills
      name: "Skills and operator procedures"
      source_patterns:
        - "templates/skills/**"
        - "plugins/**/skills/**"
        - "**/skills/**"
      generated_patterns:
        - ".github/skills/**"
      review_triggers: [skill_or_operator_procedure_change]
      targets: [skills, ai_surfaces, adapter_coherence, adapter_propagation, tests, docs]

    - route_id: route_instructions
      name: "Instructions and rules surfaces"
      source_patterns:
        - "templates/instructions/**"
        - "templates/instruction-triple/**"
        - "templates/rules-chain/**"
        - "profiles/**/.ai/RULES.md"
      generated_patterns:
        - ".github/instructions/**"
        - ".github/copilot-instructions.md"
        - ".github/project-context.md"
        - "CLAUDE.md"
        - ".ai/RULES.md"
      review_triggers: [instruction_or_rules_change]
      targets: [instructions, agents, prompts, skills, ai_surface_context_budget, tests, docs]

    - route_id: route_prompts_commands
      name: "Prompts and command guidance"
      source_patterns:
        - "templates/prompts/**"
        - "plugins/**/commands/**"
      generated_patterns:
        - ".github/prompts/**"
        - ".claude/commands/**"
      review_triggers: [prompt_or_command_guidance_change]
      targets: [prompts, commands, instructions, agents, tests, docs]

    - route_id: route_plugins_adapters_integrations
      name: "Plugins, adapters, and optional integrations"
      source_patterns:
        - "plugins/**"
        - "templates/integrations/**"
      generated_patterns:
        - ".claude-plugin/**"
      review_triggers: [plugin_adapter_or_integration_change]
      targets: [adapter_coherence, adapter_propagation, optional_integrations, tests, docs, security]

    - route_id: route_capability_contracts
      name: "Capability contracts"
      source_patterns:
        - "capabilities/**"
      generated_patterns:
        - "naos/capabilities/**"
      review_triggers: [capability_contract_change]
      targets: [capabilities, schemas, validators, policies, gates, evidence, dashboard, docs]

    - route_id: route_governed_baselines
      name: "Governed baseline artifacts"
      source_patterns:
        - "baselines/**"
      generated_patterns:
        - "naos/baselines/**"
      review_triggers: [governed_baseline_artifact_change]
      targets: [schemas, validators, tests, evidence, gates, docs]
      required_review_outputs:
        - "Validate baseline schema, provenance, accounting integrity, deterministic replay, and every threshold consumer before approval."
        - "Keep baseline updates explicit and human-reviewed; never infer approval from file presence or auto-tune thresholds."

    - route_id: route_docs_diagrams_catalogues
      name: "Documentation, diagrams, manuals, and catalogues"
      source_patterns:
        - "README.md"
        - "INSTALLATION_MANUAL.md"
        - "MAINTENANCE_PLAYBOOK.md"
        - "KNOWN_LIMITATIONS.md"
        - "NAOS_CATALOG.md"
        - "docs/**"
        - "templates/structural-seeds/naos/NAOS_QUICK_REFERENCE.md"
      generated_patterns:
        - "README.md"
        - "CONTRIBUTING.md"
        - "NAOS_QUICKSTART.md"
        - "QUICK_START.md"
        - "docs/**"
        - "naos/**/*.md"
      review_triggers: [documentation_diagram_or_catalogue_change]
      targets: [docs, manuals, tutorials, quick_reference, claims, architecture, tests]

    - route_id: route_tests_fixtures_evaluations
      name: "Tests, fixtures, graders, and evaluation batteries"
      source_patterns:
        - "tests/**"
        - "public_tests/**"
        - "task_battery/**"
        - "autoresearch/**"
        - "**/behavioral-battery/**"
      generated_patterns:
        - "tests/**"
        - "fixtures/**"
      review_triggers: [test_fixture_or_evaluation_change]
      targets: [tests, test_evidence, code, reports]

    - route_id: route_maintainer_records
      name: "Maintainer records and internal methods"
      source_patterns:
        - "dev/**"
      generated_patterns: []
      review_triggers: [maintainer_record_or_internal_method_change]
      targets: [roadmap_crosswalk, docs, next_actions, evidence]

    - route_id: route_security_privacy
      name: "Security, privacy, and secure-coding surfaces"
      source_patterns:
        - "SECURITY.md"
        - "docs/*SECURITY*.md"
        - "docs/*PRIVACY*.md"
        - "scripts/secure_coding_reporting/**"
        - "secure_coding_reporting_cli.py"
      generated_patterns:
        - "SECURITY.md"
        - "naos/*secure*.yaml"
      review_triggers: [security_or_privacy_surface_change]
      targets: [security, privacy, tests, docs]

    - route_id: route_release_repository_metadata
      name: "Release, licensing, and repository package metadata"
      source_patterns:
        - ".gitignore"
        - "CHANGELOG.md"
        - "CONTRIBUTING.md"
        - "LICENSE"
        - "NOTICE"
        - "RELEASE_NOTES.md"
        - "ROADMAP.md"
      generated_patterns: []
      review_triggers: [release_or_repository_metadata_change]
      targets: [release_gates, package_install_artifacts, docs, security]

artifact_families:
  - family_id: specs
    name: "Specs"
    enabled: true
    file_patterns:
      - "specs/*.md"
    minimum_expected:
      - "specs/01-problem.md"
      - "specs/02-solution.md"
      - "specs/03-requirements.md"
      - "specs/04-architecture.md"
    related_families: [requirements, architecture, tasks, traceability]
    review_triggers:
      - "spec_change"
      - "architecture_change"
    impact_targets: [requirements, architecture, tasks, traceability, capabilities, tests, evidence]
    required_review_outputs:
      - "Record known gaps or residual risks when spec linkage is incomplete."
    human_review_required: true
    rationale: "Spec changes often affect requirements, architecture, implementation scope, tests, and evidence."
    limitations:
      - "This rule detects configured files and review obligations; it does not validate full spec quality."

  - family_id: requirements
    name: "Requirements"
    enabled: true
