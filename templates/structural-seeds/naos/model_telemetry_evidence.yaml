version: 1
enabled: false
telemetry_declared: false
runtime_enabled: false
provider_calls_allowed: false
gateway_calls_allowed: false
mcp_allowed: false
memory_allowed: false
payload_capture_allowed: false
credential_capture_allowed: false
tool_mutation_allowed: false
route_enforcement_enabled: false
capability_maturity: L1

profile_posture:
  quickstart:
    state: optional
    severity: advisory
    human_review_required: false
    notes: "Optional local telemetry evidence hints only."
  lite:
    state: optional
    severity: warning
    human_review_required: false
    notes: "Warn when configured telemetry evidence is missing or risky."
  standard:
    state: optional
    severity: required
    human_review_required: true
    notes: "Route configured telemetry evidence gaps and policy exceptions to human review."
  assured:
    state: optional
    severity: required
    human_review_required: true
    notes: "First implementation slice remains required review only; blocking requires future validated L3+ maturity and gate wiring."

policy_linkage:
  require_policy_ref: true
  model_provider_policy_ref: "naos/model_provider_policy.yaml"

thresholds:
  cost_usd_review_threshold: null
  latency_ms_review_threshold: null
  stale_after_days: null

# Enable only when the project has local model-use telemetry summaries to review.
# This file is an evidence index, not a provider gateway or runtime router.
telemetry_sources: []
records: []

