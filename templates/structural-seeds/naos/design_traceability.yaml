version: 1
enabled: false
object_identity_declared: false
runtime_enabled: false
design_tool_calls_allowed: false
external_api_calls_allowed: false
tool_mutation_allowed: false
capability_maturity: L1

profile_posture:
  quickstart:
    state: optional
    severity: advisory
    notes: "Optional local traceability review only."
  lite:
    state: optional
    severity: warning
    notes: "Warn when configured object identity declarations have evidence gaps."
  standard:
    state: optional
    severity: required
    notes: "Route declared object-identity evidence gaps to human review."
  assured:
    state: optional
    severity: required
    notes: "First implementation slice remains required review only; blocking requires future validated L3+ maturity and gate wiring."

# Enable only for projects that want local UI screen/component object identity
# review. Optional design refs are references only; they do not prove Figma,
# html.to.design, MCP, design quality, accessibility, privacy, or brand posture.
objects: []

