governed_surface_families:
  - family_id: capabilities
    name: Capability Contracts
    enabled: true
    file_patterns:
      - "capabilities/*.yaml"
      - "naos/capabilities/*.yaml"
    target_surfaces: [policy, gatekeepers, evidence_pack, dashboard, capability_state, docs]
    human_review_required: true
    rationale: "Capability cards define governance semantics and maturity expectations."

  - family_id: secure_coding_controls
    name: Secure-Coding and Agentic-Coding Controls
    enabled: true
    file_patterns:
      - "configs/secure_coding_control_register.yaml"
      - "configs/secure_coding_control_render_manifest.yaml"
      - "capabilities/secure_coding_controls.yaml"
      - "templates/structural-seeds/naos/secure_coding_control_evidence_routes.yaml"
      - "scripts/naos_secure_coding_controls.py"
      - "scripts/validators/validate_secure_coding_control*.py"
      - "naos/secure_coding_control_register.yaml"
      - "naos/secure_coding_control_evidence_routes.yaml"
      - "naos/reports/secure_coding_controls.json"
    target_surfaces: [capabilities, policy, gatekeepers, validators, evidence_pack, secure_coding_controls, dashboard, systemic_impact, ai_surfaces, docs, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "Canonical controls and evidence routes affect operational guidance and review posture but do not acquire policy, gate, exception, approval, or compliance authority."

  - family_id: policy
    name: Policy
    enabled: true
    file_patterns:
      - "policies/default_policy.yaml"
      - "naos/policy/default_policy.yaml"
    target_surfaces: [gatekeepers, validators, evidence_pack, dashboard, docs]
    human_review_required: true
    rationale: "Policy changes can alter severity, paths, and evidence semantics."

  - family_id: gatekeepers
    name: Gatekeepers
    enabled: true
    file_patterns:
      - "naos/gatekeepers.yaml"
      - "templates/structural-seeds/naos/gatekeepers.yaml"
    target_surfaces: [evidence_pack, dashboard, capability_state, docs]
    human_review_required: true
    rationale: "Gate changes alter convergence points and profile behavior."

  - family_id: design_traceability
    name: Design Traceability
    enabled: true
    file_patterns:
      - "naos/design_traceability.yaml"
      - "templates/structural-seeds/naos/design_traceability.yaml"
      - "naos/reports/design_traceability.json"
      - "scripts/naos_design_traceability.py"
      - "schemas/naos/design_traceability.schema.json"
      - "capabilities/design_traceability.yaml"
    target_surfaces: [design_traceability, design_traceability_report, control_plane_review, gatekeepers, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "Design traceability affects optional UI object identity and local evidence review, but it does not activate design-tool sync, runtime orchestration, MCP, providers, models, memory, approval, certification, or compliance authority."

  - family_id: ui_experience_quality
    name: UI Experience Quality Review
    enabled: true
    file_patterns:
      - "naos/ui_experience_quality.yaml"
      - "templates/structural-seeds/naos/ui_experience_quality.yaml"
      - "naos/reports/ui_experience_quality.json"
      - "scripts/naos_ui_experience_quality.py"
      - "schemas/naos/ui_experience_quality.schema.json"
      - "capabilities/ui_experience_quality.yaml"
    target_surfaces: [ui_experience_quality, ui_experience_quality_report, design_traceability, model_provider_policy, control_plane_review, gatekeepers, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "UI experience quality review affects optional local UI quality evidence posture, but it does not activate Figma, MCP, browser automation, providers, models, memory, design-tool mutation, approval, certification, or compliance authority."

  - family_id: model_telemetry_evidence
    name: Model Telemetry Evidence
    enabled: true
    file_patterns:
      - "naos/model_telemetry_evidence.yaml"
      - "templates/structural-seeds/naos/model_telemetry_evidence.yaml"
      - "naos/reports/model_telemetry_evidence.json"
      - "scripts/naos_model_telemetry_evidence.py"
      - "schemas/naos/model_telemetry_evidence.schema.json"
      - "capabilities/model_telemetry_evidence.yaml"
    target_surfaces: [model_telemetry_evidence, model_telemetry_evidence_report, model_provider_policy, agent_trace_validation, session_lifecycle, control_plane_review, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "Model telemetry evidence affects optional local model-use review posture, but it does not activate providers, models, APIs, gateways, MCP, memory, route enforcement, cost accounting, approval, certification, or compliance authority."

  - family_id: failure_mode_posture
    name: Failure-Mode Posture
    enabled: true
    file_patterns:
      - "naos/failure_mode_taxonomy.yaml"
      - "templates/structural-seeds/naos/failure_mode_taxonomy.yaml"
      - "naos/reports/failure_mode_posture.json"
      - "scripts/naos_failure_mode_posture.py"
      - "schemas/naos/failure_mode_posture.schema.json"
      - "capabilities/failure_mode_posture.yaml"
    target_surfaces: [failure_mode_posture, failure_mode_posture_report, behavioral_governance_readiness, control_plane_review, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "Failure-mode posture affects optional local review statistics for factual, structural, behavioral, drift, and multi-agent failures, but it does not prevent failures, run behavioral batteries, activate learning, providers, models, MCP, memory, runtime orchestration, approval, certification, or compliance authority."

  - family_id: failure_mode_observations
    name: Failure-Mode Observations
    enabled: true
    file_patterns:
      - "naos/failure_mode_observations.yaml"
      - "templates/structural-seeds/naos/failure_mode_observations.yaml"
      - "naos/reports/failure_mode_observations.json"
      - "scripts/naos_failure_mode_observations.py"
      - "schemas/naos/failure_mode_observations.schema.json"
      - "capabilities/failure_mode_observations.yaml"
    target_surfaces: [failure_mode_observations, failure_mode_observations_report, failure_mode_posture, learning_loop_review, evidence_pack, dashboard, sarif_export, gatekeepers, systemic_impact, control_plane_review, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "Failure-mode observations affect optional local review statistics across reports and downstream review consumers, but they do not create or promote learning, mutate prompts/skills/workflows, call providers/models, activate MCP/Engram/memory, use numeric risk scores as authority, approve, block, certify, or prove compliance."

  - family_id: opencode_config_hygiene
    name: OpenCode Config Hygiene
    enabled: true
    file_patterns:
      - "naos/opencode_config_hygiene.yaml"
      - "templates/structural-seeds/naos/opencode_config_hygiene.yaml"
      - "naos/reports/opencode_config_hygiene.json"
      - "scripts/naos_opencode_config_hygiene.py"
      - "schemas/naos/opencode_config_hygiene.schema.json"
      - "capabilities/opencode_config_hygiene.yaml"
    target_surfaces: [opencode_config_hygiene, opencode_config_hygiene_report, model_provider_policy, ai_surfaces, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "OpenCode config hygiene affects optional local AI tool config review, but it does not create, run, configure, enable, disable, or mutate OpenCode, MCP, memory, providers, models, hooks, IDE settings, global config, credentials, plugins, or runtime systems."

  - family_id: validators
    name: Validators and Scripts
    enabled: true
    file_patterns:
      - "scripts/naos_*.py"
      - "scripts/validators/*.py"
      - "scripts/workflows/*.py"
    target_surfaces: [cli, make, tests, evidence_pack, dashboard, docs]
    human_review_required: true
    rationale: "Validator behavior must stay aligned with wrappers, evidence, and reporting."

  - family_id: ai_surfaces
    name: AI Tool Surfaces
    enabled: true
    file_patterns:
      - "templates/agents/*.md"
      - "templates/skills/*/SKILL.md"
      - "templates/instructions/*.instructions.md"
      - "templates/prompts/*.prompt.md"
      - "templates/cursor-rules/*.mdc"
      - "templates/rules-chain/.ai/*.yml"
      - "templates/instruction-triple/*"
    target_surfaces: [systemic_impact, control_plane_review, claims, docs, next_actions]
    human_review_required: true
    rationale: "AI guidance can drift or contradict canonical control-plane rules."

  - family_id: governed_learning_lifecycle
    name: Governed Learning Lifecycle
    enabled: true
    file_patterns:
      - "naos/learning_loop_rules.yaml"
      - "naos/learning_candidates.yaml"
      - "naos/learning_state.yaml"
      - "naos/learning_history.yaml"
      - "templates/structural-seeds/naos/learning_*.yaml"
      - "scripts/naos_learning_loop_review.py"
    target_surfaces: [memory_context, ai_surfaces, gatekeepers, evidence_pack, dashboard, capability_state, docs, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "Learning records can influence future agent behavior and must stay reviewed, scoped, reversible, and non-authoritative until approved."

  - family_id: ai_surface_context_budget
    name: AI Surface Context Budget
    enabled: true
    file_patterns:
      - "naos/ai_surface_context_budget_rules.yaml"
      - "naos/reports/ai_surface_context_budget.json"
      - "naos/baselines/ai_surface_health_baseline.json"
    target_surfaces: [ai_surfaces, static_grader, grader_assessment, gatekeepers, evidence_pack, dashboard, docs, known_gaps, residual_risks, next_actions]
    human_review_required: true
    rationale: "AI-surface context-health and baseline drift must be routed without becoming automatic threshold tuning."

  - family_id: research_findings
    name: Research and Autoresearch Findings
    enabled: true
    file_patterns:
      - "naos/research/*.md"
      - ".github/autoresearch/*.json"
      - ".github/autoresearch/*.md"
    target_surfaces: [known_gaps, residual_risks, roadmap, capabilities, policy, validators, evidence_pack, dashboard, docs, next_actions]
    human_review_required: true
    rationale: "Actionable research should route into the control plane instead of remaining standalone analysis."

  - family_id: known_gaps
    name: Known Gaps
    enabled: true
    file_patterns:
      - "naos/evidence/known_gaps.yaml"
      - "docs/KNOWN_GAPS.md"
    target_surfaces: [evidence_pack, dashboard, roadmap, next_actions]
    human_review_required: true
    rationale: "Known gaps must remain visible and route into future action."

  - family_id: residual_risks
    name: Residual Risks
    enabled: true
    file_patterns:
      - "naos/evidence/residual_risks.yaml"
      - "docs/RISK_REGISTER.md"
      - "docs/NAOS_THREAT_MODEL.md"
    target_surfaces: [evidence_pack, dashboard, gatekeepers, next_actions]
    human_review_required: true
    rationale: "Residual risks require visible disposition and governance review."

  - family_id: evidence_attestation
    name: Evidence Integrity and Reviewer Attestation
    enabled: true
    file_patterns:
      - "naos/evidence_attestation_rules.yaml"
