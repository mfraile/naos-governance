version: "1.0"
semantics:
  rules: "Project configuration for governance-surface review and research-routing evidence; not proof by itself. Family selectors belong to systemic_impact_rules.yaml artifact_families; item routing uses expected_routing_targets and human_review_required. governed_surface_families is an empty compatibility field."
  items: "Structured adopter declarations of findings or changes that need routing."
  report: "NAOS evaluates declared routing status and review obligations."
  governance_decision: "Human/project governance decides disposition, remediation, waiver, residual risk, and next action."
  flow: "declare -> evaluate -> report -> review -> approve disposition -> update"
  not_claimed:
    - "complete research coverage"
    - "complete governance-surface review"
    - "automatic remediation"
    - "governance proof"

enabled: true
items_file: control_plane_review_items.yaml

