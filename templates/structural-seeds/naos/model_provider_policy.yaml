  can_call_provider: false
  can_start_local_model: false
  can_route_runtime: false
  can_validate_credentials: false
  can_approve: false
  can_certify: false
  can_prove_compliance: false
  can_promote_maturity: false
  can_replace_deterministic_controls: false
  can_replace_human_review: false

not_claimed:
  - provider call
  - local model call
  - cloud API call
  - SDK dependency
  - networking
  - proxy startup
  - credential validation
  - runtime model routing
  - model quality guarantee
  - LLMGrader runtime
  - autoresearch provider grading
  - behavioral scoring
  - semantic drift inference
  - approval
  - certification
  - attestation
  - compliance proof
  - release authority
  - publication authority
