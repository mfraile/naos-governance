version: 1
enabled: true
runtime_enabled: false
provider_calls_allowed: false
credentials_allowed_in_repo: false
can_approve: false
can_certify: false
can_prove_compliance: false
can_promote_maturity: false
runtime_routing_authority: false
model_quality_authority: false

profile_posture:
  quickstart:
    state: optional
    severity: advisory
    human_review_required: false
    notes: "Optional declaration review only; no provider/model runtime is enabled."
  lite:
    state: optional
    severity: warning
    human_review_required: false
    notes: "Warn when declarations drift, but keep model governance lightweight."
  standard:
    state: expected
    severity: required
    human_review_required: true
    notes: "Review central role declarations before relying on model-backed or provider-specific posture."
  assured:
    state: expected
    severity: required
    human_review_required: true
    notes: "Review central role declarations; blocking posture is reserved for unsafe declaration states."

default_alias_policy:
  quickstart: allow_with_warning
  lite: allow_with_warning
  standard: review_required
  assured: pinned_required

allowed_provider_kinds:
  - declarative_only
  - cloud_api
  - local_api
  - managed_platform
  - proxy

data_policy:
  allowed_data_exposure_levels:
    - none
    - repo_metadata_only
    - repo_metadata_or_code
    - project_configured
  prohibited_data_classes:
    - secrets
    - credentials
    - tokens
    - passwords
    - private keys
    - certificates
    - connection strings
    - customer data
    - tenant data
    - regulated data
    - private memory payloads

cost_policy:
  allowed_cost_tiers:
    - low
    - medium
    - high
    - premium
    - unknown
  notes: "Cost tiers are local planning metadata only; this seed does not maintain provider pricing or recommend models."

tool_binding_policy:
  mutation_allowed: false
  require_role_reference: true
  require_cost_tier: true
  require_data_exposure_level: true
  cross_tool_drift_review_required: true
  unknown_tool_review_required: true
  allowed_tools:
    - claude_code
    - codex
    - cursor
    - gemini_cli
    - github_copilot_cli
    - opencode
    - vscode_copilot
    - openrouter
    - other
  allowed_cost_tiers:
    - low
    - medium
    - high
    - premium
    - unknown
  notes: "Tool bindings centralize declared model choices across IDE/CLI assistants. They do not rewrite tool config, call providers, validate credentials, or route runtime model use."

