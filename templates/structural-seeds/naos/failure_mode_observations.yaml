version: "1.0"
enabled: false
failure_mode_observations_declared: false

runtime_enabled: false
provider_calls_allowed: false
model_calls_allowed: false
mcp_allowed: false
memory_allowed: false
network_calls_allowed: false
hook_activation_allowed: false
tool_mutation_allowed: false
automatic_learning_allowed: false

profile_posture:
  quickstart:
    severity: advisory
    human_review_required: false
    notes: "Optional local observation statistics only."
  lite:
    severity: warning
    human_review_required: true
    notes: "Warn when configured source evidence produces review observations."
  standard:
    severity: required
    human_review_required: true
    notes: "Route configured observation findings to human review."
  assured:
    severity: required
    human_review_required: true
    notes: "Required review only in this slice; blocking requires future validated L3+ maturity and explicit gate wiring."

excluded_source_report_paths:
  - "naos/reports/control_plane_review.json"

source_reports:
  - source_id: failure_mode_posture
    source_type: failure_mode_posture_finding
    path_key: failure_mode_posture_report
    required: false
    enabled: true
  - source_id: model_provider_policy
    source_type: model_provider_policy_finding
    path_key: model_provider_policy_report
    required: false
    enabled: true
  - source_id: model_telemetry_evidence
    source_type: model_telemetry_evidence_finding
    path_key: model_telemetry_evidence_report
    required: false
    enabled: true
  - source_id: opencode_config_hygiene
    source_type: opencode_config_hygiene_finding
    path_key: opencode_config_hygiene_report
    required: false
    enabled: true
  - source_id: design_traceability
    source_type: design_traceability_finding
    path_key: design_traceability_report
    required: false
    enabled: true
  - source_id: ui_experience_quality
    source_type: ui_experience_quality_finding
    path_key: ui_experience_quality_report
    required: false
    enabled: true
  - source_id: parallel_lane_handoff
    source_type: parallel_lane_handoff_finding
    path: "naos/reports/parallel_lane_handoff/*.json"
    required: false
    enabled: true

reason_mappings:
