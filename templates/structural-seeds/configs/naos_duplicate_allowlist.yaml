# naos_duplicate_allowlist.yaml — NAOS Anti-Duplication Allowlist
# Functions and classes explicitly permitted to have similar names/signatures.
# Exemptions here prevent false-positive duplicate warnings from:
#   scripts/naos_code_quality_audit.py --check-duplicates
#
# Entry format:
#   id: unique exemption ID (DEDUP-NNN)
#   pattern: exact literal Python function/class name (no regex or globs)
#   locations: list of exact project-relative file paths (no traversal or globs)
#   reason: why duplication is acceptable
#   approved_by: who approved the exemption
#   date: YYYY-MM-DD

version: 1.0
allowlist: []  # No exemptions by default — add as needed

# ─── Usage Guide ─────────────────────────────────────────────────────────────
#
# When is duplication acceptable?
#   - Protocol/interface implementations (same method name across classes)
#   - Test fixtures vs production code
#   - Per-module utilities that happen to have the same name (e.g., format_date)
#
# When is it NOT acceptable?
#   - Identical business logic in two service files
#   - Copy-pasted DB queries with minor variations
#   - Same validation function in multiple places
#
# To add an exemption:
#
# allowlist:
#   - id: DEDUP-001
#     pattern: "format_date"
#     locations:
#       - "src/reporting/utils.py"
#       - "src/export/utils.py"
#     reason: "Module-scoped utility — different formatting requirements per module"
#     approved_by: "[your name]"
#     date: "YYYY-MM-DD"

# Existing allowed_duplicates: {name: [relative/path.py, ...]} files remain valid.
# Use exactly one format. Metadata such as approved_by is descriptive, not
# authenticated approval. Missing file means no exceptions; malformed present
# configuration produces DUPLICATE_ALLOWLIST_INVALID (exit 2).
# Backslash path separators are normalized to forward slashes for Windows.
# Semantic error-to-warning downgrade requires the same literal function name
# AND both matching approved file locations. Unrelated pairs remain findings.
