# naos_semantic_allowlist.yaml — NAOS Semantic Audit Allowlist
# Functions and code patterns explicitly permitted to skip semantic quality review.
# Exemptions here prevent false-positive warnings from:
#   scripts/naos_semantic_baseline_audit.py
#
# Entry format:
#   id: unique exemption ID (SEM-NNN)
#   pattern: file glob or function name
#   reason: why semantic review is not needed
#   category: test | generated | external | trivial
#   approved_by: who approved the exemption
#   date: YYYY-MM-DD

version: 1.0

# Categories of automatic exemptions (no need to list individually)
auto_exempt_categories:
  - test files: "tests/**/*.py"
  - generated code: "**/*.pb.py"
  - generated code: "**/*_pb2.py"
  - migrations: "[ADAPT: alembic/versions/**]"
  - vendored: "vendor/**"
  - scripts: "scripts/naos_*.py"  # governance scripts — already reviewed

# Manual exemptions (add as needed)
allowlist: []

# ─── Usage Guide ─────────────────────────────────────────────────────────────
#
# When to add a manual exemption:
#   - Trivial utility functions (no business logic, semantically obvious)
#   - External API client wrappers (logic defined by API spec)
#   - Auto-generated or vendored code that can't be modified
#
# To add an exemption:
#
# allowlist:
#   - id: SEM-001
#     pattern: "src/utils/time.py::format_timestamp"
#     reason: "Trivial time formatting — no business logic"
#     category: trivial
#     approved_by: "[your name]"
#     date: "YYYY-MM-DD"
