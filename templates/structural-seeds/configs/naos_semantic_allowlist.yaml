# Exact symbol-pair exceptions for naos_code_quality_audit.py --check-duplicates.
# Keys are taken verbatim from FUNCTION_SIMILARITY_INDEX.json entries.
# A listed pair downgrades a high-confidence cosine ERROR to WARNING; the
# finding and warning log remain visible. It does not suppress exact duplicates,
# grant approval, authorize a provider, or exempt files/categories from review.
# Missing file means no exceptions. A present malformed or legacy pattern file
# produces SEMANTIC_ALLOWLIST_INVALID (exit 2); migrate deliberately to pairs.
version: 1.0
semantic_allowlist: []

# Example (replace the empty list above; do not duplicate the YAML key):
# semantic_allowlist:
#   - pair: [services.orders.build_order, services.orders.copy_order]
#     reason: "Separately reviewed implementations with intentional similarity"
#     approved_by: "[reviewer]"
#     date: "YYYY-MM-DD"
# Pair order is irrelevant. Exactly two distinct, nonempty symbol keys are
# required. Review metadata is descriptive; NAOS does not authenticate it.
# Older semantic_allowlist/pair files remain supported. The previous seed's
# allowlist/pattern and auto_exempt_categories formats were never implemented;
# they are rejected rather than reinterpreted as approved exceptions.
