# NAOS Instinct Schema v1.0
# COPY-AS-IS — schema is generic across all projects using NAOS kit.
#
# An "instinct" is a crystallized governance pattern — observed ≥3 times
# across behavioral sessions, recorded here before promotion to RULES.md.
#
# 3 Tiers:
#   Tier 1: .github/instincts/INS-NNN.yaml  (project-scoped, git repo)
#   Tier 2: approved user-scoped memory (prefer local-first Engram under ENGRAM_DATA_DIR)
#   Tier 3: NAOS kit repo                   (universal, ships with kit)
#
# Promotion chain: Tier 1 (≥3 observations) → Tier 2 (≥5 confirmations) → Tier 3
# (≥10 across ≥2 projects)
# NEVER auto-promote — promotion requires explicit human review.

---

instinct_schema:
  version: "1.0"

  required_fields:
    id:
      type: string
      format: "INS-NNN"
      example: "INS-001"
      description: "Sequential instinct identifier"

    title:
      type: string
      max_length: 80
      description: "Verb + what — concise, searchable"
      example: "Agents skip mem_context when task has active session state"

    status:
      type: string
      values: [hypothesis, confirmed, dismissed, promoted]
      default: hypothesis
      description: "Lifecycle state — new instincts always start as hypothesis"

    tier:
      type: integer
      values: [1, 2, 3]
      description: "Current tier (1=project, 2=user, 3=universal)"

    observed_pattern:
      type: string
      description: "What behaviour was observed (factual, not evaluative)"

    context:
      type: string
      description: "When/where this pattern appears"

    mitigation:
      type: string
      description: "How to prevent or handle this pattern"

    evidence_count:
      type: integer
      minimum: 0
      description: "Number of times this pattern has been confirmed (0 when seeded)"

    first_observed:
      type: string
      format: "YYYY-MM-DD"
      nullable: true
      description: "Date first observed (null when seeded)"

    last_confirmed:
      type: string
      format: "YYYY-MM-DD"
      nullable: true
      description: "Date most recently confirmed (null when seeded)"

    source_sessions:
      type: list[string]
      description: "Engram session IDs or behavioral report filenames where observed"

  optional_fields:
    confidence:
      type: float
      range: [0.0, 1.0]
      formula: "min(evidence_count / 10, 1.0)"
      description: "Confidence score — auto-calculated from evidence_count"

    promoted_to_rule:
      type: string
      nullable: true
      description: "Rule ID if crystallized into RULES.md (e.g., RULES-24)"

    tags:
      type: list[string]
      description: "Free-form tags for search (e.g., memory, compaction, behavioral)"

    dismissed:
      type: boolean
      default: false
      description: "True if pattern was investigated and found not actionable"

    dismissal_reason:
      type: string
      nullable: true
      description: "Why the instinct was dismissed (if dismissed: true)"

  promotion_gates:
    tier_1_to_tier_2:
      evidence_count: 5
      requires: "Human review + confirmation in ≥2 independent sessions"
      action: "Record in approved user-scoped memory, preferably local-first Engram under ENGRAM_DATA_DIR; replication remains local/off unless separately reviewed"
    tier_2_to_tier_3:
      evidence_count: 10
      requires: "Observed across ≥2 different projects + human review"
      action: "Submit to NAOS kit repo as seed instinct"
    to_rule:
      evidence_count: 10
      requires: "Strong consensus, clear mitigation, testable via scenario"
      action: "Propose Rule NN in .ai/RULES.md with scenario in core_scenarios.yaml"
