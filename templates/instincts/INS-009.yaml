---

id: INS-009
title: "Account for interrupted runs before estimating API costs"
status: hypothesis
tier: 1

observed_pattern: >
  Hypothesis: an interrupted observation may leave an authorized child process
  active, and retries or partial work may affect billed usage. This seed has no
  confirming sessions. Billing treatment and overhead must be established from
  the actual provider terms and authorized usage receipts, not assumed ratios.

context: >
  Applies when planning or accounting for separately authorized behavioral runs.
  Cancellation of an observation is not evidence that its child process stopped.
  Reconcile the current task's recorded process state and usage before another
  invocation; this instruction grants no additional execution or cost authority.

mitigation: >
  Before another run, inspect only the recorded handle or PID from this task's
  own launch evidence and verify its launch identity and ownership. Request a
  stop through the originating tool or controller for that exact owned process,
  then retain its terminal status and raw logs. Never terminate by process name,
  command substring or a global process pattern. If ownership or identity is
  unknown, do not stop any process or start a replacement run; preserve evidence
  and request human resolution. Reconcile actual authorized usage receipts and
  report known costs plus unresolved usage before requesting another invocation.

