name: NAOS Control-Plane Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NAOS_PROFILE: lite
  NAOS_ROOT: naos

jobs:
  naos-readiness:
    name: NAOS deterministic readiness
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install NAOS CLI
        env:
          NAOS_ARTIFACT_URL: ${{ vars.NAOS_ARTIFACT_URL }}
          NAOS_ARTIFACT_SHA256: ${{ vars.NAOS_ARTIFACT_SHA256 }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import urlsplit

          url = os.environ.get("NAOS_ARTIFACT_URL", "")
          digest = os.environ.get("NAOS_ARTIFACT_SHA256", "")
          try:
              selected = urlsplit(url)
              selected.port  # Reject non-numeric and out-of-range ports before pip.
          except ValueError:
              sys.exit("NAOS acquisition error: malformed artifact URL.")
          if (selected.scheme != "https" or not selected.hostname
                  or selected.username is not None or selected.password is not None
                  or selected.query or selected.fragment
                  or any(character.isspace() for character in url)
                  or not selected.path.endswith((".whl", ".tar.gz"))
                  or not re.fullmatch(r"[0-9a-fA-F]{64}", digest)):
              sys.exit("NAOS acquisition error: configure an approved HTTPS artifact URL "
                       "and its independently reviewed SHA256 in repository variables.")
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check",
               "--no-cache-dir", url + "#sha256=" + digest.lower()],
              check=True,
          )
          PY

      - name: Run NAOS control-plane readiness chain
        run: |
          python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('naos_governance.scripts.naos_ci_readiness') else 'NAOS acquisition error: selected artifact lacks the readiness runner; select a compatible artifact.')"
          python -m naos_governance.scripts.naos_ci_readiness \
            --profile "$NAOS_PROFILE" --naos-root "$NAOS_ROOT"
