# Validate the whole registry document, not the bare team_config value.
# This is the team-control projection; task entries use task_registry.schema.json.
# Contextual uniqueness and enabled scope references are checked by
# naos_validate_task_registry.validate_team_config, shared by both PM consumers.
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:naos-governance:schemas:team_config:v1
title: NAOS task registry team configuration
type: [object, array]
properties:
  team_config:
    type: [object, 'null']
    description: Absent or null disables team filtering; omitted fields retain defaults.
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: false
      assignment_mode:
        type: string
        enum: [task_scope, phase_scope, module_scope]
        default: task_scope
      teams:
        type: array
        default: []
        items:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id:
              type: string
              pattern: '\S'
            label:
              type: string
            members:
              type: array
              description: Descriptive member names, not authorization or access control.
              items:
                type: string
            scope:
              type: array
              default: []
              items:
                anyOf:
                  - type: string
                    pattern: '\S'
                  - type: integer
additionalProperties: true
examples:
  - tasks:
      - {id: T-001, title: Example task, phase: 1, owner: Engineering}
    team_config:
      enabled: true
      assignment_mode: task_scope
      teams:
        - id: core
          label: Core platform
          members: [alice, bob]
          scope: [T-001]
