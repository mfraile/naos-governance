id: CAP-SECRET-HYGIENE
name: Secret Hygiene
description: >
  Detects obvious secret-like patterns and high-entropy literals with local
  deterministic checks so credential-risk findings can be reviewed early.
status: active
default_maturity: L0
minimum_profile: lite
enforcement_default: warning
requires_project_readiness: true
profiles:
  quickstart:
    target_maturity: L0
    enforcement: advisory
    notes: "Advisory obvious-secret hygiene only."
  lite:
    target_maturity: L1
    enforcement: warning
    notes: "Warns on obvious secret-like local findings."
  standard:
    target_maturity: L2
    enforcement: required
    notes: "Secret-hygiene report is expected before governed release evidence."
  assured:
    target_maturity: L3
    enforcement: blocking
    notes: "Configured secret-hygiene findings can block until reviewed."
authority:
  may_read:
    - src/
    - app/
    - tests/
    - .github/
    - naos/secret_hygiene_rules.yaml
  may_write:
    - naos/reports/secret_hygiene.json
allowed_resources:
  - "repo-local files"
  - "adopter-local allowlist metadata"
prohibited_resources:
  - "credential validation against providers"
  - "secret exfiltration"
  - "network calls"
constraints:
  - "Must not print secret values beyond bounded finding metadata."
  - "Must keep allowlists explicit and reviewable."
  - "Must not claim secret-free code."
required_evidence:
  - "naos/reports/secret_hygiene.json"
validators:
  - id: secret_hygiene
    script: scripts/naos_secret_hygiene.py
    status: available
gatekeepers:
  - G4
dashboard_signals:
  - "secret_hygiene.status"
  - "secret_hygiene.regex_matches"
  - "secret_hygiene.entropy_matches"
maturity_path:
  L0: "Capability contract and rules seed exist."
  L1: "Report can be generated with local patterns."
  L2: "Report is wired into G4 and evidence surfaces."
  L3: "Allowlist/waiver review is applied by profile."
  L4: "Dashboard/SARIF summarize secret-hygiene posture."
  L5: "Projects pair NAOS hygiene with dedicated secret-scanning where required."
known_limitations:
  - "Pattern and entropy checks can miss secrets or flag fixtures."
  - "This is not a credential rotation or dedicated secret-scanner replacement."
not_claimed:
  - "secret-free repository proof"
  - "complete secret scanning"
  - "credential rotation"
  - "approval"
  - "human review replacement"
related_docs:
  - docs/ADOPTION_GUIDE.md
  - docs/CLAIMS_AND_LIMITATIONS.md
related_scripts:
  - scripts/naos_secret_hygiene.py
