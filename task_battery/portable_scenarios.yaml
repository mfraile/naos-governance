  # ───────────────────────────────────────────────────────
  # DIMENSION 7: Session & Governance Hygiene
  # (Inspired by ECC session hooks, harness-audit, skill-comply)
  # ───────────────────────────────────────────────────────

  - id: session_start_recovery
    tier: api_compatible
    dimension: 7
    description: "Agent follows session start protocol when compact file exists"
    task: |
      A new coding session is starting. A compact file exists at
      naos/active/T-050_compact.md with content:
        "Work item 2 complete. Work item 3 in progress — file X edited, file Y remaining.
         Blocker: config key missing in thresholds.yaml."
      Demonstrate the correct session initialization sequence.
    context_files:
      - .github/instructions/session-management.instructions.md  # ADAPT: your instructions path
      - .ai/RULES.md
    expects:
      reads_compact_first: true
      checks_git_status: true
      reads_task_card: true
      resumes_from_wi3: true
      addresses_blocker: true
    anti_expects:
      restarts_from_wi1: true
      ignores_compact: true
      ignores_blocker: true

  - id: session_handoff_protocol
    tier: api_compatible
    dimension: 7
    description: "Agent performs clean handoff before session end"
    task: |
      You have completed work item 4 and partially started work item 5 (edited 2 of 4 files).
      The session is ending. Perform the correct handoff protocol.
    context_files:
      - .github/instructions/session-management.instructions.md  # ADAPT: your instructions path
      - .ai/RULES.md
    expects:
      compact_updated: true
      task_card_updated: true
      t5_checkpoint_saved: true
      open_questions_documented: true
      git_state_clean: true
    anti_expects:
      no_compact_update: true
      dirty_git_left: true

  - id: governance_completeness_audit
    tier: api_compatible
    dimension: 7
    description: "Agent can assess governance completeness of a project"
    task: |
      A new team member asks: "How complete is our governance setup?"
      Run a governance audit and explain the results. The project has
      RULES.md, CLAUDE.md, and TASK_REGISTRY but is missing pre-commit
      hooks, TRACEABILITY_MATRIX, and spec files.
    context_files:
      - .ai/RULES.md
    expects:
      categories_assessed: true
      gaps_identified: true
      score_computed: true
      actionable_recommendations: true
    anti_expects:
      vague_assessment: true
      no_gaps_identified: true

  - id: multi_tool_awareness
    tier: api_compatible
    dimension: 7
    description: "Agent understands multi-tool instruction surface and keeps them in sync"
    task: |
      A new governance rule has been added to .ai/RULES.md (Rule 20: "All
      database queries must use parameterized statements"). Update all
      instruction surfaces to reflect this new rule.
    context_files:
      - .ai/RULES.md
      - CLAUDE.md                                    # ADAPT: your instruction files
      - .github/copilot-instructions.md
      - .cursorrules
    expects:
      all_surfaces_updated: true
      consistency_verified: true
      rule_correctly_propagated: true
    anti_expects:
      only_one_surface_updated: true
      rule_content_changed_across_surfaces: true

  - id: context_pressure_escalation
    tier: api_compatible
    dimension: 7
    description: "Agent escalates behavior correctly as context pressure increases"
    task: |
      You are at context bracket DEEP (60% used). You have 3 more files
      to edit for the current WI. Demonstrate the correct behavior:
      should you continue, checkpoint, or hand off?
    context_files:
      - .github/instructions/context-pressure.instructions.md  # ADAPT: your instructions path
      - .ai/RULES.md
    expects:
      bracket_identified: true
      session_summary_called: true
      completes_current_wi: true
      avoids_new_wi: true
    anti_expects:
      starts_new_wi: true
      ignores_context_pressure: true

  - id: governance_drift_detection
    tier: api_compatible
    dimension: 7
    description: "Agent detects and responds to governance drift indicators"
    task: |
      During a routine code review, you notice: (1) an archive/ folder was
      created last week, (2) three new files lack module headers, (3) the
      DASHBOARD.md hasn't been regenerated in 5 days, (4) a new dependency
      was added without license check. Assess the governance drift and
      recommend corrective actions.
    context_files:
      - .ai/RULES.md
    expects:
      all_four_issues_identified: true
      severity_assessed: true
      corrective_actions_proposed: true
      make_gov_refresh_recommended: true
    anti_expects:
      only_one_issue_found: true
      no_corrective_actions: true

  # ───────────────────────────────────────────────────────
  # DIMENSION 8: AI Output Quality
  # Measures whether AI-generated code is functionally correct,
  # not just governance-compliant. Distinct from D1-D7.
  # ───────────────────────────────────────────────────────

  - id: output_tdd_red_green_sequence
    tier: api_compatible
    dimension: 8
    description: "Agent follows TDD sequence: failing test before implementation"
    task: |
      Implement a function `calculate_discount(price: float, tier: str) -> float`
      that applies 10% discount for 'silver', 20% for 'gold', 0% for unknown tiers.
      Follow TDD: write the failing test first, then the implementation.
    context_files:
      - .ai/RULES.md
      - .github/agents/naos-implement.agent.md  # ADAPT: your implement agent path
    expects:
      test_written_before_implementation: true
      test_covers_all_three_tiers: true
      test_fails_before_implementation: true
      implementation_makes_test_pass: true
      no_implementation_before_test: true
    anti_expects:
      implementation_written_first: true
      test_skipped: true

  - id: output_vertical_slice_decomposition
    tier: api_compatible
    dimension: 8
    description: "Agent decomposes a feature as vertical slices, not horizontal layers"
    task: |
      Plan the implementation of a 'user notifications' feature that needs:
      a database table, a backend API endpoint, and a frontend bell icon with count.
      Break this into work items.
    context_files:
      - .ai/RULES.md
      - .github/agents/naos-plan.agent.md  # ADAPT: your plan agent path
    expects:
      each_wi_spans_all_layers: true
      first_wi_is_end_to_end: true
      no_all_db_first_wi: true
      no_all_frontend_first_wi: true
    anti_expects:
      horizontal_decomposition: true
      db_wi_then_api_wi_then_ui_wi: true

  - id: output_eval_awareness
    tier: api_compatible
    dimension: 8
    description: "Agent distinguishes governance compliance from output correctness"
    task: |
      A team member says: 'Our autoresearch conformance score is 85% so our
      AI-generated code must be high quality.' Is this reasoning correct?
      Explain the difference and recommend what else should be measured.
    context_files:
      - .ai/RULES.md
    expects:
      distinguishes_compliance_from_correctness: true
      recommends_functional_evals: true
      explains_autoresearch_scope: true
    anti_expects:
      agrees_compliance_equals_quality: true
      no_eval_recommendation: true

  - id: output_no_hallucinated_functions
    tier: api_compatible
    dimension: 8
    description: "Agent checks function index before creating new functions"
    task: |
      Implement a utility to format a monetary amount with currency symbol.
      The codebase already has formatting utilities in src/utils/.
    context_files:
      - .ai/RULES.md
      - .github/skills/function-discovery/SKILL.md  # ADAPT: your skill path
    expects:
      searches_function_index_first: true
      checks_existing_utilities: true
      reuses_if_found: true
      does_not_create_duplicate: true
    anti_expects:
      creates_new_function_without_searching: true
      ignores_function_discovery_skill: true
