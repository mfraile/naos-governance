claims:
  status_values:
    - candidate
    - supported
    - unsupported
    - expired
    - experimental
    - needs_revalidation
  revalidation_triggers:
    - model_version_change
    - ide_agent_change
    - profile_change
    - validator_change
    - repository_architecture_change
    - dependency_change
    - release_boundary
    - evidence_stale
    - project_scope_change
  external_evidence_verification_default: unverified
  safe_context_window_chars: 120
  safe_context_phrases:
    - "does not claim"
    - "does not prove"
    - "not universal proof"
    - "bounded evidence"
    - "cannot guarantee"
    - "must not be claimed"
    - "unless evidence exists"
    - "not claimed"
    - "limitation"
  disclaimers:
    - "Claim validation does not prove legal or regulatory compliance."
    - "Dogfood, pilot, reference, research, model, IDE, and toolchain results are bounded evidence only."
    - "Claims may drift as models, tools, dependencies, validators, repository architecture, profile policy, gatekeeper configuration, project scope, or evidence freshness changes."
  overclaim_patterns:
    legal_regulatory_compliance:
      - "\\bguarantee[sd]?\\s+compliance\\b"
      - "\\bproves?\\s+(legal|regulatory)?\\s*compliance\\b"
      - "\\bcertif(?:y|ies|ied)\\s+compliance\\b"
      - "\\bfully\\s+compliant\\b"
    runtime_assurance:
      - "\\bguarantee[sd]?\\s+runtime\\s+safety\\b"
      - "\\bproves?\\s+runtime\\s+safety\\b"
      - "\\bfully\\s+runtime\\s+safe\\b"
      - "\\bruntime\\s+safety\\s+guarantee\\b"
    complete_test_coverage:
      - "\\bevery\\s+(generated\\s+)?source\\s+file\\s+is\\s+fully\\s+tested\\b"
      - "\\ball\\s+(generated\\s+)?code\\s+is\\s+fully\\s+tested\\b"
      - "\\bcomplete\\s+test\\s+coverage\\b"
      - "\\b100%\\s+test\\s+coverage\\b"
    neuroscience_validation:
      - "\\bneuroscience[- ]proven\\b"
      - "\\bproves?\\s+neuroscience\\s+valid(?:ity|ation)\\b"
      - "\\bvalidated\\s+by\\s+neuroscience\\b"
    petri_runtime_overclaim:
      - "\\bPETRI\\s+fully\\s+implemented\\b"
      - "\\bruntime\\s+governance\\s+fully\\s+implemented\\b"
      - "\\bcontinuous\\s+authorization\\s+implemented\\b"
    reference_generalization:
      - "\\buniversal\\s+proof\\b"
      - "\\bproves?\\s+universal\\s+outcomes\\b"
      - "\\bworks?\\s+for\\s+all\\s+projects\\b"
      - "\\bsingle\\s+project\\s+proves?\\b"

evidence:
  default_staleness_days: 30
  external_reference_default_status: external_reference_unverified

test_evidence:
  accepted_types:
    - unit
    - integration
    - acceptance
    - security
    - coverage
  coverage_supports_source_default: unknown
  global_coverage_maps_sources: false

task_claims:
  default_ttl_hours: 72

task_claim_default_ttl_hours: 72

team_gatekeepers:
  team_gatekeeper_config_enabled: true
  team_gatekeeper_strict_mode: false
