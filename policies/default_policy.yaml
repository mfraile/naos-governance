version: "1.0"
description: >
  Default file-first NAOS governance policy. Adopter projects may override this
  by placing a project-local policy at NAOS_ROOT/policy/default_policy.yaml or
  by passing --policy to standalone validators.

profiles:
  supported:
    - quickstart
    - lite
    - standard
    - assured
  default: quickstart
  severity_by_profile:
    quickstart: advisory
    lite: warning
    standard: required
    assured: blocking
  # Graduated blocking ramp: enforced control increases monotonically
  # quickstart -> lite -> standard -> assured. `fail_on` is the enforce-mode
  # target; `transition_fail_on` is the conservative baseline used while
  # `enforcement_transition: warn` (records would-block findings without failing
  # the build). `strict_fail_on` applies under --strict and ignores transition.
  exit_code:
    quickstart:
      fail_on: []
      transition_fail_on: []
      strict_fail_on: [blocking, required]
    lite:
      fail_on: [blocking]
      transition_fail_on: []
      strict_fail_on: [blocking, required, warning]
    standard:
      fail_on: [blocking, required]
      transition_fail_on: []
      strict_fail_on: [blocking, required, warning]
    assured:
      fail_on: [blocking, required, warning]
      transition_fail_on: [blocking]
      strict_fail_on: [blocking, required, warning]

# Enforcement transition mode for the graduated ramp.
#   warn    -> ramp values are advisory-preview; exit codes follow
#              transition_fail_on (v1-compatible). Records what WOULD block.
#   enforce -> exit codes follow the graduated `fail_on` ramp.
# Ships as `warn` by default (non-breaking: exit codes unchanged); adopters flip to
# `enforce` when ready to apply the graduated ramp.
enforcement_transition: warn

