claim_boundary:
  proves:
  - current public mapping-document identity by SHA-256 without requiring private Git history
  - row-level inventory identity, source metadata, locators, bounded interpretations, dispositions, and deterministic arithmetic
  - exact one-to-one coverage between current document claim identifiers and matrix rows
  - official-source freshness as observed on the recorded access date
  does_not_prove:
  - legal applicability, legal interpretation, legal compliance, certification, or professional assurance
  - implementation, control satisfaction, conformance, or operating effectiveness
  - semantic completeness of either authority or suitability of NAOS evidence for a particular institution
  numeric_scope: Numerator, denominator, inclusion, exclusion, and rounding apply to reported counts, ratios, and percentages; dates, legal identifiers, article numbers, section numbers, and version labels are locators rather than measurements.

source_register:
