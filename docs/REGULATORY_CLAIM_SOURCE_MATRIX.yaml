- id: DORA-SOURCE-001
  framework: DORA
  document_path: docs/DORA_MAPPING.md
  document_location: Section 1, paragraph DORA-SOURCE-001
  frozen_original_location: lines 11-15
  original_claim: DORA scope was described broadly, including relevant ICT third-party providers, without version, application date, or access-date metadata.
  current_claim: CELEX 32022R2554 is the current English authority used, applies from 2025-01-17, and uses the statutory critical-provider boundary.
  source:
    <<: *dora_source
    locator: Title, Article 1(1), Article 31, Article 64, and EUR-Lex document information
  paraphrase: DORA covers specified digital-operational-resilience duties for in-scope financial entities and oversight of critical ICT third-party service providers; Article 64 sets application from 2025-01-17.
  mapping_interpretation: Source identity and applicability metadata only; entity applicability is not decided here.
  bounded_rationale: The act and EUR-Lex status fields support identity and dates, while a repository cannot classify a particular adopter.
  status: verified
  document_action: corrected_and_retained
  claim_effect: authority_fact
  numeric_derivations:
  - name: numbered articles in the act
    kind: count
    reported_value: 64 articles
    unit: numbered articles
    numerator: 64
    denominator: 64
    inputs: [inclusive integer identifiers 1 through 64]
    inclusion_rule: Include each uniquely numbered Article from 1 through 64 once.
    exclusion_rule: Exclude recitals, chapter headings, paragraphs, subparagraphs, annex material, and amended-instrument provisions as separate count units.
    rounding_rule: none; exact integer count
    computed_result: 64 articles
    derivation_supported: true
  reproduction_command: python3 -B scripts/validators/validate_regulatory_claim_source_matrix.py --claim DORA-SOURCE-001 --json
  falsifier: EUR-Lex shows a newer English consolidated act, an English-applicable amendment or corrigendum that changes these locators, or a different application date.
  independent_review: *independent_review

