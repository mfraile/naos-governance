    official_title: Guideline E-23 - Model Risk Management (2027)
    official_url: https://www.osfi-bsif.gc.ca/en/guidance/guidance-library/guideline-e-23-model-risk-management-2027
    document_identifier: OSFI Guideline E-23 final guideline
    version: Final guideline published 2025-09-11; current but not yet effective on access date
    publication_date: '2025-09-11'
    effective_date: '2027-05-01'
    application_date: '2027-05-01'
    access_date: '2026-08-22'
  OSFI_E23_LETTER:
    issuing_authority: Office of the Superintendent of Financial Institutions Canada
    official_title: Final Guideline E-23 - Model Risk Management letter
    official_url: https://www.osfi-bsif.gc.ca/en/guidance/guidance-library/guideline-e-23-model-risk-management-2027-letter
    document_identifier: OSFI final-guideline letter for E-23
    access_date: '2026-08-22'
